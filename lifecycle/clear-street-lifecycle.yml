deprecation:
  policy_url: https://docs.clearstreet.com/changelog/
  policy_kind: changelog-announced
  sunset_header: false
  rfc8594: false
  practice: >
    Clear Street announces deprecations and breaking changes in a dated public changelog with
    explicit DEPRECATED and BREAKING labels, and a field is typically marked DEPRECATED
    (returning null) before it is removed in a later BREAKING entry. There is no separate
    written deprecation-policy page, no stated notice window, and no Sunset/Deprecation
    response headers in either specification.
  worked_examples:
  - {field: 'instrument.expiry', deprecated: '2026-06-17', removed: '2026-07-20', notice_days: 33}
  - {field: 'instrument.strike_price', deprecated: '2026-06-17', removed: '2026-07-20', notice_days: 33}
  - {field: 'screener.field_filter', deprecated: '2026-06-17', removed: '2026-06-29', notice_days: 12}
  pending:
  - {fields: [day_trade_buying_power, day_trade_count, pattern_day_trader], deprecated: '2026-06-04',
     scope: balances, status: marked-for-future-removal}
deprecated_operations: []
deprecated_operations_note: >
  No operation in either specification carries `deprecated: true`. Deprecation at Clear Street
  has so far been expressed at the field and enum level, not the operation level.

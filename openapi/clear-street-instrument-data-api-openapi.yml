          example: 2025-07-25
        eps_actual:
          type:
          - string
          - 'null'
          description: 'The actual earnings per share (EPS) for the period

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '1.35'
        eps_estimate:
          type:
          - string
          - 'null'
          description: 'The estimated earnings per share (EPS) for the period

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '1.30'
        eps_surprise_percent:
          type:
          - string
          - 'null'
          description: 'The percentage difference between actual and estimated EPS

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '3.8'
        report_time:
          oneOf:
          - type: 'null'

                        eps_estimate: '1.60'
                        eps_surprise_percent: '2.5'
                        revenue_actual: '94930000000'
                        revenue_estimate: '94500000000'
                        revenue_surprise_percent: '0.45'
                      instrument_id: a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8

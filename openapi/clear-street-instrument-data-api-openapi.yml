        revenue_actual:
          type:
          - string
          - 'null'
          description: 'The actual total revenue for the period

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '391035000000'
        revenue_estimate:
          type:
          - string
          - 'null'
          description: 'The estimated total revenue for the period

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '391025000000'
        revenue_surprise_percent:
          type:
          - string
          - 'null'
          description: 'The percentage difference between actual and estimated revenue

            When a null/undefined value is observed, it indicates that there is no available data.'
          example: '0.05'

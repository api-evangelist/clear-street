        - sor
        - dark
        - ap
        - pov
        - twap
        - vwap
        - dma
      description: >
        Strategy type used for execution, can be one of below.

        - `sor`: Smart order router (default)

        - `dark`: Dark pool

        - `ap`: Arrival price

        - `pov`: Percentage of volume

        - `twap`: Time weighted average price

        - `vwap`: Volume weighted average price

        - `dma`: Direct market access


        For more information on these strategies, please refer to our
        [documentation](https://docs.clearstreet.io/studio/docs/execution-strategies).
      default: sor
    Urgency:
      type: string
      enum:
        - super-passive
        - passive
        - moderate
        - aggressive
        - super-aggressive
      description: The urgency associated with the execution strategy.
      default: moderate
    MinPercent:
      type: integer
      minimum: 0
      maximum: 100
      example: 1
      description: The minimum percentage of market volume. Must be an integer between 0 and 100 (inclusive).
    TargetPercent:
      type: integer
      minimum: 0
      maximum: 100
      example: 50
      description: The target percentage of market volume. Must be an integer between 0 and 100 (inclusive).
    MaxPercent:
      type: integer
      minimum: 0
      maximum: 100
      example: 50
      description: The maximum percentage of market volume. Must be an integer between 0 and 100 (inclusive).
    MaxPercentVolume:
      type: integer
      minimum: 0
      maximum: 50
      example: 35
      description: The maximum percentage of market volume. Must be an integer between 0 and 50 (inclusive).
    BaseStrategy:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StrategyType'
          description: The type of strategy. This must be set to the respective strategy type.
        start_at:
          $ref: '#/components/schemas/Timestamp'
          description: The timestamp to start routing.
        end_at:
          $ref: '#/components/schemas/Timestamp'
          description: The timestamp to stop routing, defaults to market close.
        urgency:
          $ref: '#/components/schemas/Urgency'
      required:
        - type
    SorStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
    ApStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
        - type: object
          properties:
            min_percent:
              $ref: '#/components/schemas/MinPercent'
            max_percent:
              $ref: '#/components/schemas/MaxPercent'
    DarkStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
        - type: object
          properties:
            max_percent:
              $ref: '#/components/schemas/MaxPercent'
    DmaStrategy:
      properties:
        type:
          $ref: '#/components/schemas/StrategyType'
        destination:
          $ref: '#/components/schemas/Destination'
      required:
        - type
        - destination
    PovStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
        - type: object
          properties:
            target_percent:
              $ref: '#/components/schemas/TargetPercent'
          required:
            - target_percent
    TwapStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
        - type: object
          properties:
            min_percent:
              $ref: '#/components/schemas/MinPercent'
            max_percent:
              $ref: '#/components/schemas/MaxPercentVolume'
    VwapStrategy:
      allOf:
        - $ref: '#/components/schemas/BaseStrategy'
        - type: object
          properties:
            min_percent:
              $ref: '#/components/schemas/MinPercent'
            max_percent:
              $ref: '#/components/schemas/MaxPercentVolume'
    Strategy:
      discriminator:
        propertyName: type
        mapping:
          sor: '#/components/schemas/SorStrategy'
          vwap: '#/components/schemas/VwapStrategy'
          twap: '#/components/schemas/TwapStrategy'
          ap: '#/components/schemas/ApStrategy'
          pov: '#/components/schemas/PovStrategy'
          dark: '#/components/schemas/DarkStrategy'
          dma: '#/components/schemas/DmaStrategy'
      anyOf:
        - $ref: '#/components/schemas/SorStrategy'
        - $ref: '#/components/schemas/VwapStrategy'
        - $ref: '#/components/schemas/TwapStrategy'
        - $ref: '#/components/schemas/ApStrategy'
        - $ref: '#/components/schemas/PovStrategy'
        - $ref: '#/components/schemas/DarkStrategy'
        - $ref: '#/components/schemas/DmaStrategy'
    MpId:

    RegTGroupMember:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
          description: The symbol for the instrument.
        asset_class:
          $ref: '#/components/schemas/AssetClass'
        quantity:
          $ref: '#/components/schemas/Quantity'
          description: The quantity held for this instrument.
        market_value:
          type: number
          format: double
          description: Market value of the instrument.
        market_value_percent:
          type: number
          format: double
          description: >
            The percentage market value of the instrument in terms of the total `net_market_value` of all
            positions held.

            Formula: `market_value / net_market_value`
      required:
        - symbol
        - asset_class
        - quantity
        - market_value
        - market_value_percent
    RegTGroup:
      type: object
      properties:
        name:
          type: string
          description: Unique name of the group, typically the symbol of the underlier.
        market_value:
          type: number
          format: double
          description: The aggregated market value of all instruments for the symbol group.
        market_value_percent:
          type: number
          format: double
          description: >
            The percentage market value of the symbol group in terms of the total net_market_value of all
            positions.

            Formula: `(market_value / net_market_value)`
        effective_requirement:
          type: number
          format: double
          description: The enforced margin requirement in effect for the symbol group.
        house_requirement:
          type: number
          format: double
          description: Margin requirements based on Clear Street's house margin methodology for the symbol group.
        exchange_requirement:
          type: number
          format: double
          description: Margin requirements based on regulatory rules for the symbol group.
        margin_percent:
          type: number
          format: double
          description: |
            The percentage effective margin requirement in terms of the symbol group market value.
            Formula: `(effective_requirement / net_market_value)`
        margin_percent_contribution:
          type: number
          format: double
          description: |
            The percentage effective margin requirement in terms of the total effective requirement.
            Formula: `(effective_requirement / sum(effective_requirement))`
        members:
          type: array
          description: A list of securities that comprise this group.
          items:
            $ref: '#/components/schemas/RegTGroupMember'
      required:
        - name
        - market_value
        - market_value_percent
        - effective_requirement
        - house_requirement
        - exchange_requirement
        - margin_percent
        - margin_percent_contribution
        - members
    RegTMargin:
      type: object
      properties:
        version:
          type: string
          description: Unique identifier for this margin calculation.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Timestamp of when this margin was calculated.
        net_market_value:
          type: number
          format: double
          description: Market value net of long and short market values.
        effective_requirement:
          type: number
          format: double
          description: The enforced margin requirement in effect.
        effective_excess:
          type: number
          format: double
          description: >-
            The maring amount by taking the difference between total equity and the effective requirement. A
            negative number reflects an effective margin deficit.
        house_requirement:
          type: number
          format: double
          description: Margin requirements based on Clear Street's house margin methodology.
        house_excess:
          type: number
          format: double
          description: >-
            The margin amount by taking the difference between total equity and the house requirement. A
            negative number reflects a house margin deficit.
        exchange_requirement:
          type: number
          format: double
          description: Margin requirements based on regulatory rules.
        exchange_excess:
          type: number
          format: double
          description: >-
            The margin amount by taking the difference between total equity and the exchange requirement. A
            negative number reflects an regulatory margin deficit.
        sma:
          type: number
          format: double
          description: >-
            Special Memorandum Account (SMA). The regulatory line of credit amount for margin trading based on
            market value, trading activity, and available cash.
        sod_buying_power:
          type: number
          format: double
          description: The limit, or "up-to" amount, of securities value that can be day-traded for a given trading day.
        overnight_buying_power:
          type: number
          format: double
          description: The limit, or "up-to" amount, of securities value that can be purchased and held overnight.
        day_trade_buying_power:
          type: number
          format: double
          description: The remaining amount of start_of_day_buying_power that captures any day-trading activity.
        groups:
          type: array
          description: Reg-T margin groups
          items:
            $ref: '#/components/schemas/RegTGroup'
      required:
        - version
        - timestamp
        - net_market_value
        - effective_requirement
        - effecive_excess
        - house_requirement
        - house_excess
        - exchange_requirement
        - exchange_deficit
        - sma
        - sod_buying_power
        - overnight_buying_power
        - day_trade_buying_power
        - groups
    RegTMarginSimulation:
      type: object
      properties:
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Timestamp of when this simulation was created.
        name:
          $ref: '#/components/schemas/SimulationName'
          description: Name of this simulation that you provided when creating it.
        simulation_id:

        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Timestamp of when this margin was calculated.
        net_market_value:
          type: number
          format: double
          description: Sum of market values across all positions.
        effective_requirement:
          type: number
          format: double
          description: The enforced margin requirement in effect.
        effecive_excess:
          type: number
          format: double
          description: >-
            The maring amount by taking the difference between total equity and the effective requirement. A
            negative number reflects an effective margin deficit.
        house_requirement:
          type: number
          format: double
          description: Margin requirements based on Clear Street's house margin methodology.
        house_excess:
          type: number
          format: double
          description: >-
            The margin amount by taking the difference between total equity and the house requirement. A
            negative number reflects a house margin deficit.
        risk_based_requirement:
          type: number
          format: double
          description: A component margin requirement that captures base-case risk under house margin methodology.
        risk_based_requirement_percent:
          type: number
          format: double
          description: |
            The percentage risk_base margin requirement in terms of total house requirement
            Formula: `risk_based_requirement / house_requirement`
        non_marginable_requirement:
          type: number
          format: double
          description: >-
            A component margin requirement that captures risk for security instruments that are not margin

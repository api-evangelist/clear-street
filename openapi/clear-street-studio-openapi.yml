      description: Get located inventory for a symbol.
      tags:
        - Inventories
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            $ref: '#/components/schemas/AccountId'
            description: The account ID or account number to get the inventory for.
        - in: path
          name: symbol
          required: true
          schema:
            $ref: '#/components/schemas/Symbol'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocateInventory'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /entities:
    get:
      operationId: listEntities
      summary: List entities
      description: List all available entities.
      tags:
        - Entities
      responses:
        '200':
          description: A list of entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /entities/{entity_id}:
    get:
      operationId: getEntity
      summary: Get entity
      description: Get an entity by its ID.
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          description: The ID of the entity to get.
          schema:
            $ref: '#/components/schemas/EntityId'
      responses:
        '200':
          description: The entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      description: List all available accounts.

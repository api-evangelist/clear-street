  /entities/{entity_id}/regt-margin:
    get:
      operationId: getRegTMargin
      summary: Get Reg-T margin
      description: Get the latest Reg-T margin calculation for the given entity
      tags:
        - Margin
      parameters:
        - in: path
          name: entity_id
          required: true
          schema:
            $ref: '#/components/schemas/EntityId'
          description: Entity ID
      responses:
        '200':
          description: Reg-T margin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegTMargin'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /entities/{entity_id}/portfolio-margin:
    get:
      operationId: getPortfolioMargin
      summary: Get portfolio margin
      description: Get latest portfolio margin calculation for the given entity
      tags:
        - Margin
      parameters:
        - in: path
          name: entity_id
          required: true
          schema:
            $ref: '#/components/schemas/EntityId'
          description: Entity ID
      responses:
        '200':
          description: Portfolio margin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioMargin'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /entities/{entity_id}/regt-margin-simulations:
    post:
      operationId: createRegTMarginSimulation
      summary: Create Reg-T simulation
      description: >
        Simulate Reg-T margin calculation for a given hypothetical set of prices and/or trades. This is useful
        for understanding the impact of price fluctuations or trades on margin requirements. Once a simulation
        is created, it remains available for 48-hours, after which it will automatically be deleted.


        Simulations created through the API are visible in the Studio UI under the Risk & Margin section,
        after enabling the "Risk Simulations" toggle.
      tags:
        - Margin Simulations
      parameters:
        - in: path
          name: entity_id
          required: true
          schema:
            $ref: '#/components/schemas/EntityId'
          description: Entity ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/SimulationName'
                  description: A name for this simulation for reference.
                prices:
                  type: array
                  description: >-
                    List of prices to use in the simulation, i.e. fair-market-values you specify for each
                    symbol. If this is not provided, current market prices will be used, if they are
                    available.
                  items:
                    $ref: '#/components/schemas/SimulationPrice'
                trades:
                  type: array
                  description: List of hypothetical trades to include in the simulation, if any.
                  items:
                    $ref: '#/components/schemas/SimulationTrade'
                ignore_existing:
                  type: boolean
                  default: false
                  description: >-
                    If true, the simulation will ignore any existing positions and balances in the account.
                    Set to true if you want to simulate from a clean slate, i.e. an empty account.
              required:
                - name
      responses:
        '200':
          description: Reg-T margin simulation
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id:
                    $ref: '#/components/schemas/SimulationId'
                required:
                  - simulation_id
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
  /entities/{entity_id}/regt-margin-simulations/{simulation_id}:
    get:
      operationId: getRegTMarginSimulation
      summary: Get Reg-T simulation
      description: >-
        Get a Reg-T margin simluation that was previously created. Note, simulations are automatically deleted
        after 48-hours.
      tags:
        - Margin Simulations
      parameters:
        - in: path
          name: entity_id
          required: true
          schema:
            $ref: '#/components/schemas/EntityId'
          description: Entity ID
        - in: path
          name: simulation_id
          required: true
          schema:
            $ref: '#/components/schemas/SimulationId'
          description: Simulation ID
      responses:
        '200':
          description: Reg-T margin simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegTMarginSimulation'
        default:
          $ref: '#/components/responses/error'
      security:
        - BearerAuth: []
components:
  responses:
    error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Date:
      type: integer
      format: int32
      minimum: 20150101
      maximum: 29999999
      example: 20240101
      description: Integer in YYYYMMDD representing a date.
    Timestamp:
      type: integer
      format: int64
      minimum: 1710613560668
      maximum: 2900000000000
      description: Milliseconds since epoch.
    EntityId:
      type: string
      minLength: 1
      maxLength: 256
      example: '100000'
      description: Entity ID for the legal entity.
    AccountId:
      type: string
      minLength: 1
      maxLength: 256
      example: '100000'
      description: Account ID for the account.
    AccountNumber:
      type: string
      minLength: 1
      maxLength: 256
      example: ACC0001
      description: Account number for the account.
    Currency:
      type: string
      minLength: 3
      maxLength: 3
      example: USD
      description: ISO 4217 currency code.
    Symbol:
      type: string
      minLength: 1
      maxLength: 32
      example: AAPL
    SymbolFormat:
      type: string
      enum:
        - cms
        - osi
      description: Denotes the format of the provided `symbol` field.
    AssetClass:
      type: string
      enum:
        - other
        - currency
        - equity
        - option
        - debt
        - fund
      description: The asset class of the symbol.
    Quantity:
      type: string
      minLength: 1
      maxLength: 16
      example: '100'
      description: String representation of quantity.
    Price:
      type: string
      minLength: 1
      maxLength: 16
      example: '123.99'
      description: String representation of a price.
    Rate:
      type: string
      minLength: 1
      maxLength: 16
      example: '0.23'
      description: String representation of a rate.
    Balance:
      type: string
      minLength: 1
      maxLength: 16
      example: '123.99'
      description: String representation of a cash balance.
    BuySell:
      type: string
      enum:
        - buy
        - sell
      description: Either buy or sell side.
    LongShort:
      type: string
      enum:
        - long
        - short
      description: Either long or short position.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: number
          minimum: 100
          maximum: 599
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the specific occurrence of the problem. It may or may not yield
            further information if dereferenced.
      additionalProperties: false
      description: A Problem Details object (RFC 9457)
    PnlSum:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        asset_class:
          $ref: '#/components/schemas/AssetClass'
        day_pnl:
          type: number
          format: double
          description: Sum of profit and loss from intraday trading activities for the given date range
        position_pnl:
          type: number
          format: double
          description: Sum of profit and loss from previous trading date.
        unrealized_pnl:
          type: number
          format: double
          description: Sum of profit and loss from market changes.
        realized_pnl:
          type: number
          format: double
          description: Sum of profit and loss realized from position closing trading activity.
        total_pnl:
          type: number
          format: double
          description: |
            `realized_pnl + unrealized_pnl`
        net_pnl:
          type: number
          format: double
          description: >
            `P&L after netting all realized and unrealized P&L, adjustments, dividends, change in accruals,
            income and expenses`
        sold_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Sum of quantity sold.
        sold_notional:
          type: number
          format: double
          description: Sum of the notional sold.
        bought_quantity:
          $ref: '#/components/schemas/Quantity'
          description: Sum of quantity bought.
        bought_notional:
          type: number
          format: double
          description: Sum of the notional bought.
    Holding:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        symbol_description:
          type: string
          description: Description of the symbol.
        asset_class:
          $ref: '#/components/schemas/AssetClass'
        quantity:
          $ref: '#/components/schemas/Quantity'
          description: >-
            The quantity held for the given symbol. This is an EOD quantity if querying historically, else the
            current real-time quantity for the current date.
        sod_quantity:
          $ref: '#/components/schemas/Quantity'
          description: The quantity held for the given symbol at the start of the day.
      required:
        - symbol
        - asset_class
        - quantity
        - sod_quantity
    OrderId:
      type: string
      minLength: 1
      maxLength: 256
      example: '12390213'
      description: Unique order ID assigned by us.
    TradeId:
      type: string
      minLength: 1
      maxLength: 256
      example: '12390213'
      description: Unique trade ID assigned by us.
    ReferenceId:
      type: string
      minLength: 1
      maxLength: 256
      example: my-order-id-123
      description: An ID that you provide.
    OrderSide:
      type: string
      enum:
        - buy
        - sell
        - sell-short
      description: Buy, sell, sell-short indicator.
    TimeInForce:
      type: string
      enum:
        - day
        - ioc
        - day-plus
        - at-open
        - at-close
      description: >
        The lifecycle enforcement of this order.

        - `day`: The order will exist for the duration of the current trading session

        - `ioc`: The order will immediately be executed or cancelled

        - `day-plus`: The order will exist only for the duration the current trading session plus extended
        hours, if applicable

        - `at-open`: The order will exist only for the opening auction of the next session

        - `at-close`: The order will exist only for the closing auction of the current session
    OrderType:
      type: string
      enum:
        - limit
        - market
        - stop
        - stop-limit
      description: >
        The type of order, can be one of the following:

        - `limit`: A limit order will execute at-or-better than the limit price you specify

        - `market`: An order that will execute at the prevailing market prices

        - `stop`: A stop order will result in a market order when the market price reaches the specified stop
        price

        - `stop-limit`: A stop limit order will result in a limit order when the market price reaches the
        specified stop price
    OrderState:
      type: string
      enum:
        - open
        - rejected
        - closed
      description: >
        Simplified order state, which is inferred from `OrderStatus`. Makes it easier to determine whether an
        order can be executed against.

        - `open`: Order *can* potentially be executed against.

        - `rejected`: Order *cannot* be executed against because it was rejected. This is a terminal state.

        - `closed`: Order *cannot* be executed against. This is a terminal state.
    OrderStatus:
      type: string
      enum:
        - new
        - partially-filled
        - filled
        - canceled
        - replaced
        - pending-cancel
        - stopped
        - rejected
        - suspended
        - pending-new
        - calculated
        - expired
        - accepted-for-bidding
        - pending-replace
        - done-for-day
      description: >-
        Granular order status using [standard values come FIX tag
        39](https://www.fixtrading.org/online-specification/order-state-changes).
    OrderUpdateReason:
      type: string
      enum:
        - place
        - modify
        - cancel
        - execution-report
        - cancel-reject
        - reject
    OpenCloseIndicator:
      type: string
      enum:
        - open
        - close
    Destination:
      type: string
      enum:
        - arcx
        - bats
        - baty
        - edga
        - edgx
        - eprl
        - iexg
        - memx
        - xase
        - xbos
        - xcis
        - xnms
        - xnys
      description: |
        Order Destination.
        <table><thead>
        <tr>
        <th>MIC</th>
        <th>Exchange</th>
        </tr></thead>
        <tbody>
        <tr>
        <td>ARCX</td>
        <td>NYSE ARCA</td>
        </tr>
        <tr>
        <td>BATS</td>
        <td>BATS Exchange</td>
        </tr>
        <tr>
        <td>BATY</td>
        <td>BATS Y Exchange</td>
        </tr>
        <tr>
        <td>EDGA</td>
        <td>EDGA Exchange</td>
        </tr>
        <tr>
        <td>EDGX</td>
        <td>EDGX Exchange</td>
        </tr>
        <tr>
        <td>EPRL</td>
        <td>MIAX Pearl Equities</td>
        </tr>
        <tr>
        <td>IEXG</td>
        <td>Investors' Exchange</td>
        </tr>
        <tr>
        <td>MEMX</td>
        <td>Members' Exchange</td>
        </tr>
        <tr>
        <td>XASE</td>
        <td>NYSE American</td>
        </tr>
        <tr>
        <td>XBOS</td>
        <td>NASDAQ BX Exchange</td>
        </tr>
        <tr>
        <td>XCIS</td>
        <td>NYSE National</td>
        </tr>
        <tr>
        <td>XNMS</td>
        <td>NASDAQ/NMS (Global Market)</td>
        </tr>
        <tr>
        <td>XNYS</td>
        <td>New York Stock Exchange</td>
        </tr>
        </tbody></table>
    CreateOrder:
      type: object
      properties:
        reference_id:
          $ref: '#/components/schemas/ReferenceId'
        order_type:
          $ref: '#/components/schemas/OrderType'
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          $ref: '#/components/schemas/Quantity'
          description: The maximum quantity to be executed.
        price:
          $ref: '#/components/schemas/Price'
          description: The price to execute at-or-better for limit orders.
        stop_price:
          $ref: '#/components/schemas/Price'
          description: The price at which stop orders become marketable.
        time_in_force:
          $ref: '#/components/schemas/TimeInForce'
        locate_broker:
          type: string
          minLength: 1
          maxLength: 256

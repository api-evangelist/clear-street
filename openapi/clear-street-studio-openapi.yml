        discretionary_requirement_percent:
          type: number
          format: double
          description: |
            The percentage discretionary margin requirements in terms of total house requirement
            Formula: `discretionary_requirement / house_requirement`
        vega_requirement:
          type: number
          format: double
          description: A component margin requirement that captures risk based on vega.
        groups:
          type: array

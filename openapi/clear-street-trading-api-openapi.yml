        - ONE_WEEK
        - ONE_MONTH
        - THREE_MONTHS
        - SIX_MONTHS
        - YEAR_TO_DATE
        - ONE_YEAR
    FieldPeriod:
      type: string
      description: Reporting period for financial data fields.
      enum:
        - QUARTER
        - TRAILING_TWELVE_MONTHS
        - ANNUAL
    FieldRef:
      type: object
      description: A reference to a screener field.
      required:
        - name
      properties:
        lookback:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldLookback"
              description: Optional historical lookback window.
        name:
          type: string
          description: The field name.
          example: market_cap
        period:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldPeriod"
              description: Optional reporting period (e.g. quarter or TTM).
        value_type:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldType"
              description: The data type of the field value. Present only in responses.
      example:
        name: market_cap
    FieldType:
      type: string
      description: The data type of a screener field value.
      enum:
        - DECIMAL
        - INTEGER
        - STRING
        - ANALYST_RATING
        - DATE
    FilterOpSpec:
      type: object
      description: Operator specification with optional behavioral arguments.
      required:
        - name
      properties:
        args:
          type: array
          items:
            $ref: "#/components/schemas/OperatorArg"
          description: Optional arguments that modify operator behavior.
        name:
          $ref: "#/components/schemas/FilterOperator"
          description: The operator to apply.
      example:
        name: GREATER_OR_EQUAL
    FilterOperator:
      type: string
      description: |-
        Filter operators supported by the screener.

        Abbreviated and lowercase forms are accepted as serde aliases for backward
        compatibility with earlier API revisions; the canonical wire form is the
        SCREAMING_SNAKE_CASE rendering.
      enum:
        - LESS_THAN
        - LESS_OR_EQUAL
        - GREATER_THAN
        - GREATER_OR_EQUAL
        - EQUAL
        - BETWEEN
        - NOT_BETWEEN
        - ONE_OF
        - REGEX
        - BEGINS_WITH
        - ENDS_WITH
        - CONTAINS
        - IS_NULL
        - IS_NOT_NULL
    FilterValue:
      type: object
      description: "A filter value: either a literal or a variable reference."
      properties:
        value:
          oneOf:
            - type: number
            - type: string
            - type: "null"
        variable:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Variable"
              description: A variable reference.
      example:
        value: 1000000000.0
    FiscalPeriodType:
      type: string
      description: Fiscal period type for earnings reports
      enum:
        - QUARTERLY
        - ANNUAL
        - TTM
        - BIANNUAL
    GtdAccepts:
      type: object
      description: Good-till-date order acceptance capabilities
      required:
        - date
        - timestamp
      properties:
        date:
          type: boolean
          description: Whether the venue accepts date-only expiration (YYYY-MM-DD)
          example: true
        timestamp:
          type: boolean
          description: Whether the venue accepts precise timestamp expiration
          example: true
    Instrument:
      allOf:
        - type: object
          required:
            - id
            - symbol
            - venue
            - country_of_issue
            - currency
            - is_marginable
            - easy_to_borrow
            - is_short_prohibited
            - is_threshold_security
            - is_liquidation_only
            - is_tradable
            - is_fractionable
            - is_ptp
          properties:
            adv:
              type:
                - string
                - "null"
              description: |-
                Average daily share volume from the security definition.
                When a null/undefined value is observed, it indicates that there is no available data.
              example: "75000000"
            country_of_issue:
              type: string
              description: The ISO country code of the instrument's issue
              example: US
            currency:
              type: string
              description: The ISO currency code in which the instrument is traded
              example: USD
            easy_to_borrow:
              type: boolean
              description: Indicates if the instrument is classified as Easy-To-Borrow
              example: true
            id:
              type: string
              format: uuid
              description: Unique instrument identifier (UUID)
              example: 0f5a1a4e-5b3e-4d8f-9b7a-2b1d0e3f4a5b
            instrument_type:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/SecurityType"
                  description: |-
                    The type of security (e.g., Common Stock, ETF)
                    When a null/undefined value is observed, it indicates that there is no available data.
            is_fractionable:
              type: boolean
              description: Indicates if the instrument supports fractional-quantity orders
              example: false
            is_liquidation_only:
              type: boolean
              description: Indicates if the instrument is liquidation only and cannot be bought
              example: false
            is_marginable:
              type: boolean
              description: Indicates if the instrument is marginable
              example: true
            is_ptp:
              type: boolean
              description: |-
                Indicates if the instrument is a publicly traded partnership (PTP).
                PTP sales are subject to a 10% withholding tax for non-US tax residents.
              example: false
            is_short_prohibited:
              type: boolean
              description: Indicates if short selling is prohibited for the instrument
              example: false
            is_threshold_security:
              type: boolean
              description: Indicates if the instrument is on the Regulation SHO Threshold Security List
              example: false
            is_tradable:
              type: boolean
              description: Indicates if the instrument is tradable
              example: true
            long_margin_rate:
              type:
                - string
                - "null"
              description: |-
                The percent of a long position's value you must post as margin
                When a null/undefined value is observed, it indicates that there is no available data.
              example: "0.25"
            name:
              type:
                - string
                - "null"
              description: |-
                The full name of the instrument or its issuer
                When a null/undefined value is observed, it indicates that there is no available data.
              example: Apple Inc.
            notional_adv:
              type:
                - string
                - "null"
              description: |-
                Notional average daily volume (ADV multiplied by previous close price).
                When a null/undefined value is observed, it indicates that there is no available data.
              example: "15815250000"
            previous_close:
              type:
                - string
                - "null"
              description: |-
                Last close price from the security definition.
                When a null/undefined value is observed, it indicates that there is no available data.
              example: "210.87"
            short_margin_rate:
              type:
                - string
                - "null"
              description: |-
                The percent of a short position's value you must post as margin
                When a null/undefined value is observed, it indicates that there is no available data.
              example: "0.25"
            symbol:
              type: string
              description: The trading symbol for the instrument
              example: AAPL
            venue:
              type: string
              description: The MIC code of the primary listing venue
              example: XNMS
          example:
            country_of_issue: US
            currency: USD
            easy_to_borrow: true
            id: 0f5a1a4e-5b3e-4d8f-9b7a-2b1d0e3f4a5b
            instrument_type: COMMON_STOCK
            is_fractionable: false
            is_liquidation_only: false
            is_marginable: true
            is_ptp: false
            is_short_prohibited: false
            is_threshold_security: false
            is_tradable: true
            long_margin_rate: "0.25"
            name: Apple Inc.
            short_margin_rate: "0.25"
            symbol: AAPL
            venue: XNMS
        - type: object
          properties:
            options_expiry_dates:
              type:
                - array
                - "null"
              items:
                type: string
                format: date
              description: |-
                Available options expiration dates for this instrument.
                Present only when `include_options_expiry_dates=true` in the request.
                When a null/undefined value is observed, it indicates it does not apply.
      description: Represents a tradable financial instrument.
      example:
        country_of_issue: US
        currency: USD
        easy_to_borrow: true
        id: 0f5a1a4e-5b3e-4d8f-9b7a-2b1d0e3f4a5b
        instrument_type: COMMON_STOCK
        is_fractionable: false
        is_liquidation_only: false
        is_marginable: true
        is_ptp: false
        is_short_prohibited: false
        is_threshold_security: false
        is_tradable: true
        long_margin_rate: "0.25"
        name: Apple Inc.
        short_margin_rate: "0.25"
        symbol: AAPL
        venue: XNMS

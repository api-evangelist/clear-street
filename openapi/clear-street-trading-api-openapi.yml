    DailySummary:
      type: object
      description: |-
        Daily aggregate (OHLV) summary for a single instrument.

        Returned by `GET /market-data/daily-summary`. Every field except
        `instrument_id` and `not_applicable` is `Option`:
        - Unresolvable `instrument_id` → all other fields `None` (including `symbol`).
        - Resolvable `instrument_id` with no realtime cache entry → `symbol`
          populated, OHLV/`trade_date` `None`.
        - `trade_date` reflects the session the OHLV represents (today during
          trading hours, the last trading date during weekends/holidays).
        - `not_applicable` is a non-optional `bool`, always serialized: `true` for
          instrument types with no daily summary by definition (e.g. an index, whose
          OHLV/`trade_date` are `None`), `false` otherwise.
      required:
        - instrument_id
      properties:
        high:
          type:
            - string
            - "null"
          description: |-
            Session high.
            When a null/undefined value is observed, it indicates that there is no available data.
        instrument_id:
          type: string
          format: uuid
          description: Unique instrument identifier. Always populated; echoes the request ID.
        low:
          type:
            - string
            - "null"
          description: |-
            Session low.
            When a null/undefined value is observed, it indicates that there is no available data.
        not_applicable:
          type: boolean
          description: |-
            `true` when the instrument type has no daily summary by definition (e.g. an
            index). Distinguishes an intentional N/A from OHLV that is merely not loaded
            yet. `false` for instruments that can have a summary.
        open:
          type:
            - string
            - "null"
          description: |-
            Opening price for the session.
            When a null/undefined value is observed, it indicates that there is no available data.
        symbol:
          type:
            - string
            - "null"
          description: |-
            Display symbol for the security. `None` for unresolvable IDs.
            When a null/undefined value is observed, it indicates that there is no available data.
        trade_date:
          type:
            - string
            - "null"
          format: date
          description: |-
            Session date the OHLV represents, US/Eastern.
            When a null/undefined value is observed, it indicates that there is no available data.
        volume:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Session cumulative trading volume.
            When a null/undefined value is observed, it indicates that there is no available data.
      example:
        high: "215.20"
        instrument_id: a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8
        low: "210.10"
        not_applicable: false
        open: "211.00"
        symbol: AAPL
        trade_date: 2026-04-23
        volume: 88000000

          description: Unique identifier for this execution report.
          example: 019d216d-9857-7e23-ae01-edc07126c9e4
        instrument_id:
          type:
            - string
            - "null"
          format: uuid
          description: |-
            Unique instrument identifier. `null` when this fill has no single resolvable
            instrument.
            When a null/undefined value is observed, it indicates it does not apply.
          example: 528ec5c3-cdbf-447c-b995-ec6c83cfbc02
        order_id:
          type: string
          format: uuid
          description: Identifier of the order this execution belongs to.
          example: 01928b4d-c000-7000-8000-000000000001
        price:
          type:
            - string
            - "null"
          description: |-
            Fill price. `null` for multileg fills, whose price lives only at the leg level.
            When a null/undefined value is observed, it indicates it does not apply.
          example: "150.25"
        quantity:
          type: string
          description: Filled quantity.
          example: "100"
        side:
          $ref: "#/components/schemas/Side"
          description: Side of the fill.
        symbol:
          type:
            - string
            - "null"
          description: |-
            Trading symbol. `null` when this fill has no single resolvable instrument.
            When a null/undefined value is observed, it indicates it does not apply.
          example: AAPL
        transaction_time:
          type: string
          format: date-time
          description: Transaction timestamp in nanosecond precision (UTC).
          example: 2026-03-24T19:58:43.798000Z
      example:
        id: 019d216d-9857-7e23-ae01-edc07126c9e4
        instrument_id: 528ec5c3-cdbf-447c-b995-ec6c83cfbc02
        order_id: 01928b4d-c000-7000-8000-000000000001
        price: "150.25"
        quantity: "100"
        side: BUY
        symbol: AAPL
        transaction_time: 2026-03-24T19:58:43.798000Z
    ExecutionList:
      type: array

                    metadata:
                      request_id: 7b34ad9b-e09a-40d1-aab8-2185a8df5a31
        "422":
          description: Malformed request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                PayloadMissingAccountId:
                  summary: Missing required account_id field in JSON body
                  value:
                    error:
                      code: 422
                      message: "Failed to deserialize the JSON body into the target type: missing field `account_id` at line 3 column 3"
                    metadata:
                      request_id: 9fbd975d-be1e-4710-9004-1f54d0d4dfb6
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/omni-ai/threads/{thread_id}/response:
    get:
      tags:
        - Omni AI
      summary: Get Thread Response
      description: |-
        Get the active response for a thread.

        Convenience endpoint to look up the currently active response for a thread
        without knowing the `response_id`. Useful when reloading a thread whose
        last finalized message is a `USER` message — this indicates an assistant
        turn is likely in progress.


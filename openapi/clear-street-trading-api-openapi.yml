  /v1/omni-ai/threads/{thread_id}/messages:
    get:
      tags:
        - Omni AI
      summary: Get Messages
      description: |-
        List finalized messages in a thread.

        Returns the latest page of **finalized** messages by default, with messages
        within each page ordered chronologically. Messages from in-progress
        assistant turns are excluded — use
        `GET /omni-ai/threads/{thread_id}/response` or
        `GET /omni-ai/responses/{response_id}` for live output.

        If the last finalized message has role `USER`, an active response likely
        exists and should be polled separately.
      operationId: get_messages
      parameters:
        - name: thread_id
          in: path
          description: Thread to list messages for
          required: true
          schema:
            type: string
            format: uuid
        - name: account_id
          in: query
          description: Account ID for the request
          required: true
          schema:
            type: integer
            format: int64
        - name: page_size
          in: query
          description: The number of items to return per page. Only used when page_token is not provided.
          required: false
          schema:
            type: integer
            format: int64
            default: 100
            maximum: 100
            minimum: 1
        - name: page_token
          in: query
          description: Token for retrieving the next or previous page of results. Contains encoded pagination state; when provided, page_size is ignored.
          required: false
          schema:
            type: string
            format: byte
            description: Base64URL-encoded pagination token
          example: eyJvZmZzZXQiOjEwMCwibGltaXQiOjEwMH0=
      responses:
        "200":
          description: Paginated list of finalized messages; latest page by default, chronological within each page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/MessageList"
                type: object
              examples:
                ThreadMessages:
                  summary: User and assistant finalized messages
                  value:
                    data:
                      - content:
                          parts:
                            - text: How are the markets doing today?
                              type: text
                        created_at: 2026-04-16T09:20:17.274943+00:00
                        id: 019d9597-5983-7691-8281-7ce264127740
                        outcome: completed
                        role: USER
                        seq: 1
                        thread_id: 019d9597-597c-7571-a0c9-a49c0e51f6eb
                      - content:
                          parts:
                            - text: |-
                                **Pre-market as of 7:30 AM ET**

                                 ...
                              type: text
                            - payload:
                                actionButtons:
                                  - buttonId: btn_followup_0
                                    label: Check my positions
                                    prompt:
                                      prompt: What are my current positions?
                              type: suggested_actions
                        created_at: 2026-04-16T09:20:17.309212+00:00
                        id: 019d9597-599c-7132-a7de-e5c21eaaab77
                        outcome: completed
                        role: ASSISTANT
                        seq: 2
                        thread_id: 019d9597-597c-7571-a0c9-a49c0e51f6eb
                    metadata:
                      request_id: 664c0f85-cdab-4fac-afe3-8ecc0148cd4a
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Forbidden:
                  summary: Caller does not have permission
                  value:
                    error:
                      code: 403
                      message: The caller does not have permission to execute the specified operation
                    metadata:
                      request_id: e3e4df36-1c33-45b1-b06d-832c80adbbf6
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ThreadNotFound:
                  summary: Requested thread does not exist
                  value:

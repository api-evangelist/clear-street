    Response:
      type: object
      description: Dynamic pollable response.
      required:
        - id
        - status
        - thread_id
        - user_message_id
      properties:
        content:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResponseContent"
              description: When a null/undefined value is observed, it indicates that there is no available data.
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ErrorStatus"
              description: When a null/undefined value is observed, it indicates it does not apply.
        id:
          type: string
          format: uuid
        output_message_id:
          type:
            - string
            - "null"

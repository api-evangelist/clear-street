      properties:
        field:
          $ref: "#/components/schemas/FieldRef"
          description: Field reference (same shape as filter/sort field references)
        name:
          type: string
          description: Human-readable display name for this field
          example: Market Cap
        type:
          type:
            - string
            - "null"
          description: |-
            Value format hint: "CURR_USD", "PERCENT", etc. Omitted when not applicable.
            When a null/undefined value is observed, it indicates it does not apply.
        value:
          oneOf:
            - type: number
            - type: string
            - type: "null"
      example:
        field:
          name: market_cap
          value_type: DECIMAL
        name: Market Cap
        type: CURR_USD
        value: 2890000000000.0
    ScreenerEntry:
      type: object
      description: A saved screener configuration entry
      required:
        - id
        - name
        - filters
        - created_at
        - updated_at
      properties:
        columns:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/FieldRef"
          description: Field references included when running this screener.
        created_at:
          type: string
          format: date-time
        filters:
          type: array
          items:
            $ref: "#/components/schemas/SearchFilter"
        id:
          type: string
          format: uuid
        name:
          type: string
        sorts:
          type:
            - array

            - "null"
          description: Income before income tax expense
          example: "26400000000"
        income_tax_expense:
          type:
            - string
            - "null"
          description: Income tax expense for the period
          example: "4200000000"
        interest_expense:
          type:
            - string
            - "null"
          description: Interest paid on debt
          example: "1450000000"
        interest_income:
          type:
            - string
            - "null"
          description: Interest earned on investments and cash
          example: "1200000000"
        net_income:
          type:
            - string
            - "null"
          description: Total net income for the period
          example: "22200000000"
        net_income_deductions:
          type:
            - string
            - "null"
          description: Deductions from net income
        net_income_from_continuing_operations:
          type:
            - string
            - "null"
          description: Net income from continuing operations
          example: "22200000000"
        net_income_from_discontinued_operations:
          type:
            - string
            - "null"
          description: Net income from discontinued operations
        net_interest_income:
          type:
            - string
            - "null"
          description: Net interest income (interest income minus interest expense)
          example: "-250000000"
        non_operating_income_excluding_interest:
          type:
            - string
            - "null"
          description: Non-operating income excluding interest
          example: "100000000"
        operating_expenses:
          type:
            - string
            - "null"
          description: Total operating expenses
          example: "16300000000"
        operating_income:
          type:
            - string
            - "null"
          description: Income from core business operations
          example: "26550000000"
        other_adjustments_to_net_income:
          type:
            - string
            - "null"
          description: Other adjustments to net income
        other_expenses:
          type:
            - string
            - "null"
          description: Other miscellaneous expenses
          example: "0"
        period:
          type: string
          description: The fiscal period identifier (e.g., "Q1", "Q2", "Q3", "Q4")
          example: Q1
        period_type:
          $ref: "#/components/schemas/FiscalPeriodType"
          description: The type of fiscal period
        reported_currency:
          type: string
          description: The currency in which the statement is reported (ISO 4217)
          example: USD
        research_and_development_expenses:
          type:
            - string
            - "null"
          description: Expenditure on research and development activities
          example: "7700000000"
        revenue:
          type:
            - string
            - "null"
          description: Total revenue from sales of goods and services
          example: "94930000000"
        selling_and_marketing_expenses:
          type:
            - string
            - "null"
          description: Expenditure on marketing and sales activities
          example: "6100000000"
        selling_general_and_administrative_expenses:

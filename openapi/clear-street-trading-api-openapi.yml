        thread_id:
          type: string
          format: uuid
        user_message_id:
          type: string
          format: uuid
    ResponseContent:
      type: object
      description: Dynamic response content container. May include thinking parts.
      required:
        - parts
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ResponseContentPart"
    ResponseContentPart:
      oneOf:

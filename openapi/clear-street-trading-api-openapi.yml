        - change
        - change_percent
      properties:
        change:
          type: string
          description: Absolute change from previous close to last trade.
        change_percent:
          type: string
          description: Percent change from previous close to last trade.
        previous_close:
          type: string
          description: Previous session close price.
    SortDirection:
      type: string
      description: Sort direction sorted results

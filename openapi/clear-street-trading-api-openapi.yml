    InstrumentCore:
      type: object
      required:
        - id
        - symbol
        - venue
        - country_of_issue
        - currency
        - is_marginable
        - easy_to_borrow
        - is_short_prohibited
        - is_threshold_security
        - is_liquidation_only
        - is_tradable
        - is_fractionable
        - is_ptp
      properties:
        adv:
          type:
            - string
            - "null"
          description: |-
            Average daily share volume from the security definition.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "75000000"
        country_of_issue:
          type: string
          description: The ISO country code of the instrument's issue
          example: US
        currency:
          type: string
          description: The ISO currency code in which the instrument is traded
          example: USD
        easy_to_borrow:
          type: boolean
          description: Indicates if the instrument is classified as Easy-To-Borrow
          example: true
        id:
          type: string
          format: uuid
          description: Unique instrument identifier (UUID)
          example: 0f5a1a4e-5b3e-4d8f-9b7a-2b1d0e3f4a5b
        instrument_type:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SecurityType"
              description: |-
                The type of security (e.g., Common Stock, ETF)
                When a null/undefined value is observed, it indicates that there is no available data.
        is_fractionable:
          type: boolean
          description: Indicates if the instrument supports fractional-quantity orders
          example: false
        is_liquidation_only:
          type: boolean
          description: Indicates if the instrument is liquidation only and cannot be bought
          example: false
        is_marginable:
          type: boolean
          description: Indicates if the instrument is marginable
          example: true
        is_ptp:
          type: boolean
          description: |-
            Indicates if the instrument is a publicly traded partnership (PTP).
            PTP sales are subject to a 10% withholding tax for non-US tax residents.
          example: false
        is_short_prohibited:
          type: boolean
          description: Indicates if short selling is prohibited for the instrument
          example: false
        is_threshold_security:
          type: boolean
          description: Indicates if the instrument is on the Regulation SHO Threshold Security List
          example: false
        is_tradable:
          type: boolean
          description: Indicates if the instrument is tradable
          example: true
        long_margin_rate:
          type:
            - string
            - "null"
          description: |-
            The percent of a long position's value you must post as margin
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "0.25"
        name:
          type:
            - string
            - "null"
          description: |-
            The full name of the instrument or its issuer
            When a null/undefined value is observed, it indicates that there is no available data.
          example: Apple Inc.
        notional_adv:
          type:
            - string
            - "null"
          description: |-
            Notional average daily volume (ADV multiplied by previous close price).
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "15815250000"
        previous_close:
          type:
            - string
            - "null"
          description: |-
            Last close price from the security definition.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "210.87"
        short_margin_rate:
          type:
            - string
            - "null"
          description: |-
            The percent of a short position's value you must post as margin
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "0.25"
        symbol:
          type: string
          description: The trading symbol for the instrument
          example: AAPL
        venue:
          type: string
          description: The MIC code of the primary listing venue
          example: XNMS
      example:
        country_of_issue: US
        currency: USD
        easy_to_borrow: true
        id: 0f5a1a4e-5b3e-4d8f-9b7a-2b1d0e3f4a5b

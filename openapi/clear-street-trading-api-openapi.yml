    StructuredAction:
      oneOf:
        - type: object
          title: PrefillOrder
          description: Prefill an order ticket for user confirmation
          required:
            - prefill_order
          properties:
            prefill_order:
              $ref: "#/components/schemas/PrefillOrderAction"
              description: Prefill an order ticket for user confirmation
        - type: object
          title: OpenChart
          description: Open a chart for a symbol
          required:
            - open_chart
          properties:
            open_chart:
              $ref: "#/components/schemas/OpenChartAction"
              description: Open a chart for a symbol
        - type: object
          title: OpenScreener
          description: Open a stock screener with filters
          required:
            - open_screener
          properties:
            open_screener:
              $ref: "#/components/schemas/OpenScreenerAction"
              description: Open a stock screener with filters
        - type: object
          title: OpenEntitlementConsent
          description: Open entitlement consent flow
          required:
            - open_entitlement_consent
          properties:
            open_entitlement_consent:
              $ref: "#/components/schemas/OpenEntitlementConsentAction"
              description: Open entitlement consent flow
      description: |-
        Structured actions that Omni AI can return to clients.

        These actions provide machine-readable instructions for the client to execute,
        such as prefilling an order ticket, opening a chart, or navigating to a route.
    StructuredActionButtonAction:
      type: object
      description: Structured-action button behavior.
      properties:
        actionId:
          type:
            - string
            - "null"
          format: uuid
          description: |-
            UUID of a `structured_action` content part in the same message.
            When a null/undefined value is observed, it indicates it does not apply.
    SuggestedActionsPayload:
      type: object
      description: Suggested follow-up buttons rendered at the end of an assistant message.
      properties:
        actionButtons:
          type: array
          items:
            $ref: "#/components/schemas/ActionButton"
          description: Ordered message-level buttons.
      example:
        actionButtons:
          - buttonId: btn_show_aapl_1y
            label: Show AAPL over 1 year
            prompt:
              prompt: Show AAPL over the last year
          - buttonId: btn_compare_aapl_spy
            label: Compare AAPL vs SPY
            prompt:
              prompt: Compare AAPL vs SPY over 1 year
    Thread:
      type: object
      description: Thread metadata returned by list/get thread endpoints.
      required:
        - id
        - title
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
        id:
          type: string
          format: uuid
        title:
          type: string
        updated_at:
          type: string
    ThreadList:
      type: array
      items:
        $ref: "#/components/schemas/Thread"
    TimeInForce:
      type: string
      description: Time in force
      enum:
        - DAY
        - GOOD_TILL_CANCEL
        - IMMEDIATE_OR_CANCEL
        - FILL_OR_KILL
        - GOOD_TILL_DATE
        - AT_THE_OPENING
        - AT_THE_CLOSE
        - GOOD_TILL_CROSSING
        - GOOD_THROUGH_CROSSING
        - AT_CROSSING
        - OTHER
    TradingSessions:
      type: object
      description: Trading sessions for a market day with full timestamps
      properties:
        after_hours:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SessionSchedule"
              description: |-
                After-hours session schedule, null if not available
                When a null/undefined value is observed, it indicates it does not apply.
        pre_market:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SessionSchedule"
              description: |-
                Pre-market session schedule, null if not available
                When a null/undefined value is observed, it indicates it does not apply.
        regular:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SessionSchedule"
              description: |-
                Regular trading session schedule, null if holiday/weekend
                When a null/undefined value is observed, it indicates it does not apply.
      example:
        after_hours:
          close: 2025-10-15T20:00:00-04:00
          open: 2025-10-15T16:00:00-04:00
        pre_market:
          close: 2025-10-15T09:30:00-04:00
          open: 2025-10-15T04:00:00-04:00
        regular:
          close: 2025-10-15T16:00:00-04:00
          open: 2025-10-15T09:30:00-04:00
    TrailingOffsetType:
      type: string
      description: Trailing offset type for trailing stop orders.
      enum:
        - PRICE
        - BPS
    TupleUnit:
      default: null
    UpdateAccountSettingsRequest:
      type: object
      description: Request to update account settings
      properties:
        risk:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RiskSettings"
              description: Risk settings for the account
      additionalProperties: false
      example:
        risk:
          max_notional: "5000000.00"
    Variable:
      type: object
      description: A variable reference (field or built-in like `today`).
      required:
        - name
      properties:
        lookback:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldLookback"
              description: Optional historical lookback window.
        modifier:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Modifier"
              description: Optional arithmetic modifier.
        name:
          type: string
          description: The variable name.
          example: today
        period:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FieldPeriod"
              description: Optional reporting period.
      example:
        modifier:
          args:
            - 30
            - DAY
          name: SUBTRACT
        name: today
    VenueSession:
      type: object
      description: A trading session within a venue's trading day
      required:
        - name
        - start_local
        - end_local
      properties:
        end_local:
          type: string
          description: Session end time in venue's local timezone (HH:MM format, 24-hour)
          example: 16:00
        name:
          type: string
          description: The name of the trading session
          example: CONTINUOUS
        start_local:
          type: string
          description: Session start time in venue's local timezone (HH:MM format, 24-hour)
          example: 09:30
      example:
        end_local: 16:00
        name: CONTINUOUS
        start_local: 09:30
    Version:
      type: object
      description: API version information
      required:
        - version
      properties:
        version:
          type: string
          description: API version string
    WatchlistDetail:
      type: object
      description: Detailed watchlist with all items
      required:
        - id
        - name
        - created_at
        - items
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        id:
          type: string
          format: uuid
          description: Watchlist ID
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItemEntry"
          description: Items in the watchlist
        name:
          type: string
          description: Watchlist name
    WatchlistEntry:
      type: object
      description: Represents a user watchlist.
      required:
        - id
        - name
        - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: The timestamp when the watchlist was created.
        id:
          type: string
          format: uuid
          description: The unique identifier for the watchlist.
        name:
          type: string
          description: The user-provided watchlist name.
    WatchlistEntryList:
      type: array
      items:
        $ref: "#/components/schemas/WatchlistEntry"
    WatchlistItemEntry:
      type: object
      description: A single item in a watchlist
      required:
        - id
        - added_at
      properties:
        added_at:
          type: string
          format: date-time
          description: When the item was added
        added_price:
          type:
            - string
            - "null"
          description: |-
            Price when the item was added
            When a null/undefined value is observed, it indicates that there is no available data.
        id:
          type: string
          format: uuid
          description: Item ID
        instrument:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Instrument"
              description: |-
                Instrument details
                When a null/undefined value is observed, it indicates that there is no available data.
    i64:
      type: integer
      format: int64
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []
tags:
  - name: API version
    description: Endpoints for API service metadata.
  - name: Accounts
    description: Manage trading accounts, balances, and portfolio history.
  - name: Orders
    description: Place, monitor, and manage trading orders.
  - name: Positions
    description: View positions and manage position instructions.
  - name: Watchlist
    description: Create and manage watchlists.
  - name: Instruments
    description: Retrieve core details and discovery endpoints for tradable instruments.
  - name: Instrument Data
    description: Retrieve instrument analytics, market data, news, and related reference data.
  - name: Calendar
    description: Access clocks and financial calendars for market sessions and events.
  - name: Screener
    description: Search instruments and manage saved screeners.
  - name: Websocket
    description: Active Websocket.
  - name: Omni AI
    description: Thread-centric AI assistant for conversational trading. Create threads to start conversations, poll response objects for in-progress output, and read finalized messages from thread history. Thread/message/response endpoints require an explicit account_id. Entitlement endpoints are caller-scoped and use account_ids.

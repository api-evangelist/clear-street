          items:
            $ref: "#/components/schemas/SortSpec"
        updated_at:
          type: string
          format: date-time
    ScreenerEntryList:
      type: array
      items:
        $ref: "#/components/schemas/ScreenerEntry"
    ScreenerFilter:
      type: object
      description: A single filter criterion for the screener.
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Field to filter on (e.g., "market_cap", "sector", "price")
          example: market_cap
        operator:
          type: string
          description: Comparison operator (e.g., "eq", "gte", "lte", "in")
          example: gte
        value:
          type: object
          description: Filter value
      example:
        field: market_cap
        operator: gte
        value: 10000000000
    ScreenerRow:
      type: array
      items:
        $ref: "#/components/schemas/ScreenerColumn"
      description: A single row of screener columns for one instrument.
    ScreenerRowList:
      type: array
      items:
        $ref: "#/components/schemas/ScreenerRow"
    ScreenerSearchRequest:
      allOf:
        - $ref: "#/components/schemas/PaginationParams"
        - type: object
          properties:
            columns:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/FieldRef"
              description: Subset of fields to include in the response.
            filters:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/SearchFilter"
              description: Filter conditions to apply.
            sort_case_sensitive:
              type:
                - boolean
                - "null"
              description: "Whether string sorts should be case-sensitive (default: false)."
            sorts:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/SortSpec"
              description: Multi-field sort specifications.
      description: Request body for POST /screener.
      example:
        columns:
          - name: market_cap
          - name: price
          - name: volume
        filters:
          - left:
              name: market_cap
            op:
              name: GREATER_OR_EQUAL
            right:
              - value: 1000000000.0
        page_size: 25
        sorts:
          - direction: DESC
            field:
              name: market_cap
    SearchFilter:
      type: object
      description: |-
        A single filter condition.

        When `op` and `right` are both absent, the filter is "unenabled":
        it persists a `left` field reference without applying any predicate.
        Unenabled filters are skipped during search execution but still
        round-trip through save/load so callers can preserve draft state.
      required:
        - left
      properties:
        left:
          $ref: "#/components/schemas/FieldRef"
          description: The field to filter on.
        op:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FilterOpSpec"
              description: The operator and optional arguments. Omit together with `right` for an unenabled filter.
        right:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/FilterValue"
          description: The value(s) to compare against. Omit together with `op` for an unenabled filter.
      example:
        left:
          name: market_cap
        op:
          name: GREATER_OR_EQUAL
        right:
          - value: 1000000000.0

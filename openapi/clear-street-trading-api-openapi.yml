    InstrumentDividendEvent:
      type: object
      description: Represents a dividend event for an instrument
      required:
        - ex_date
        - adjusted_dividend_amount
      properties:
        adjusted_dividend_amount:
          type: string
          description: The adjusted dividend amount accounting for any splits.
          example: "0.88"
        declaration_date:
          type:
            - string
            - "null"
          format: date
          description: |-
            The declaration date of the dividend
            When a null/undefined value is observed, it indicates that there is no available data.
          example: 2025-07-25
        dividend_amount:
          type:
            - string
            - "null"
          description: |-
            The dividend amount per share.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "0.88"
        dividend_yield:
          type:
            - string
            - "null"
          description: |-
            The dividend yield as a percentage of the stock price.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: "1.25"
        ex_date:
          type: string
          format: date
          description: The day the stock starts trading without the right to receive that dividend.
          example: 2025-08-15
        frequency:
          type:
            - string
            - "null"
          description: |-
            The frequency of the dividend payments (e.g., "Quarterly", "Annual").
            When a null/undefined value is observed, it indicates that there is no available data.
          example: Quarterly
        payment_date:
          type:
            - string
            - "null"
          format: date
          description: |-
            The payment date is the date on which a declared stock dividend is scheduled to be paid.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: 2025-08-20
        record_date:
          type:
            - string
            - "null"
          format: date
          description: |-
            The record date, set by a company's board of directors, is when a
            company compiles a list of shareholders of the stock for which it has declared a dividend.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: 2025-08-01
      example:
        adjusted_dividend_amount: "0.88"
        declaration_date: 2025-07-25
        dividend_amount: "0.88"
        dividend_yield: "1.25"
        ex_date: 2025-08-15
        frequency: Quarterly
        payment_date: 2025-08-20
        record_date: 2025-08-01

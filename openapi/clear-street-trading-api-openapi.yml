components:
  schemas:
    Account:
      type: object
      description: Represents a trading account
      required:
        - id
        - short_name
        - full_name
        - type
        - subtype
        - open_date
        - account_holder_entity_id
        - options_level
        - status
      properties:
        account_holder_entity_id:
          type: integer
          format: int64
          description: The account holder entity identifier
          example: 987654321
        close_date:
          type:
            - string
            - "null"
          format: date
          description: |-
            The date the account was closed, if applicable
            When a null/undefined value is observed, it indicates it does not apply.
          example: 2026-01-15
        full_name:
          type: string
          description: The full legal name of the account
          example: Test Trading Account
        id:
          $ref: "#/components/schemas/i64"
          description: The unique identifier for the account
        open_date:
          type: string
          format: date
          description: The date the account was opened
          example: 2023-01-15
        options_level:
          $ref: "#/components/schemas/i64"
          description: The options level of the account
        short_name:
          type: string
          description: The short name of the account
          example: TST-ACCOUNT-01
        status:
          $ref: "#/components/schemas/AccountStatus"
          description: The current status of the account
        subtype:
          $ref: "#/components/schemas/AccountSubtype"
          description: The sub-type of account
        type:
          $ref: "#/components/schemas/AccountType"
          description: The type of account
      example:
        account_holder_entity_id: 987654321
        close_date: null
        full_name: Test Trading Account
        id: 19816
        open_date: 2023-01-15
        options_level: 1
        short_name: TST-ACCOUNT-01
        status: ACTIVE
        subtype: MARGIN
        type: CUSTOMER
    AccountBalances:
      type: object
      description: Represents the balance details for a trading account
      required:
        - account_id
        - buying_power
        - currency
        - equity
        - long_market_value
        - settled_cash
        - withdrawable_cash
        - trade_cash
        - open_order_adjustment
        - unsettled_credits
        - unsettled_debits
        - margin_type
        - unrealized_pnl
        - daily_unrealized_pnl
        - daily_total_pnl
        - daily_pnl
        - daily_change
        - daily_realized_pnl
        - sod
      properties:
        account_id:
          $ref: "#/components/schemas/i64"
          description: The unique identifier for the account
        buying_power:
          type: string
          description: The total buying power available in the account.
          example: "500000.00"
        currency:
          type: string
          description: Currency identifier for all monetary values.
          example: USD
        daily_change:
          type: string
          description: Difference between current equity and start-of-day equity.
          example: "0.00"
        daily_pnl:
          type: string
          description: Total profit or loss since start of day.
          example: "1250.00"
        daily_realized_pnl:
          type: string
          description: Realized profit or loss since start of day.
          example: "700.00"
        daily_total_pnl:
          type: string
          description: Total profit or loss since start of day.
          example: "1250.00"
        daily_unrealized_pnl:
          type: string
          description: Total unrealized profit or loss across all positions relative to prior close.
          example: "550.00"
        equity:
          type: string
          description: The total equity in the account.
          example: "250000.00"
        long_market_value:
          type: string
          description: The total market value of all long positions.
          example: "170000.00"
        margin_details:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MarginDetails"
              description: |-
                Margin-account-only details.
                When a null/undefined value is observed, it indicates it does not apply.
        margin_type:
          $ref: "#/components/schemas/MarginType"
          description: The applicable margin model for the account
        multiplier:
          type:
            - string
            - "null"
          description: |-
            Applied multiplier for margin calculations.
            When a null/undefined value is observed, it indicates it does not apply.
          example: "2"
        open_order_adjustment:
          type: string
          description: Signed buying-power correction from open orders.
          example: "-5000.00"
        settled_cash:
          type: string
          description: The amount of cash that is settled and available for withdrawal or trading.
          example: "80000.00"
        short_market_value:
          type:
            - string
            - "null"
          description: |-
            The total market value of all short positions.
            When null/undefined, the value should be assumed to be zero. The field is omitted to simplify the response.
          example: "20000.00"
        sod:
          $ref: "#/components/schemas/AccountBalancesSod"
          description: Start-of-day snapshot balances.
        trade_cash:
          type: string
          description: Trade-date effective cash.
          example: "122086.50"
        unrealized_pnl:
          type: string
          description: Total unrealized profit or loss across all open positions.
          example: "1500.00"
        unsettled_credits:
          type: string
          description: Trade-date unsettled cash credits.
          example: "100.00"
        unsettled_debits:
          type: string
          description: Trade-date unsettled cash debits.
          example: "100.00"
        withdrawable_cash:
          type: string
          description: The amount of cash currently available to withdraw.
          example: "75000.00"
      example:
        account_id: 19816
        buying_power: "90000.00"
        currency: USD
        daily_change: "0.00"
        daily_pnl: "1250.00"
        daily_realized_pnl: "700.00"
        daily_total_pnl: "1250.00"
        daily_unrealized_pnl: "550.00"
        equity: "100000.00"
        long_market_value: "40000.00"
        margin_details:
          day_trade_buying_power_usage: "0.00"
          day_trade_count: 2
          initial_margin_excess: "50000.00"
          initial_margin_requirement: "50000.00"
          intraday_details:
            buying_power: "90000.00"
            multiplier: "2"
          maintenance_margin_excess: "75000.00"
          maintenance_margin_requirement: "25000.00"
          overnight_details:
            buying_power: "90000.00"
            multiplier: "2"
          pattern_day_trader: false
          top_contributors:
            - day_trade_buying_power_usage: "5000.00"
              initial_margin_requirement: "25000.00"
              maintenance_margin_requirement: "15000.00"
              market_value: "50000.00"
              underlying_instrument_id: a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8
          usage:
            total: "100000.00"
            used: "5000.00"
        margin_type: REG_T
        multiplier: "2"
        open_order_adjustment: "-10000.00"
        settled_cash: "99775.05"
        short_market_value: "10000.00"
        sod:
          asof: 2023-09-27
          buying_power: "90000.00"
          day_trade_buying_power: "200000.00"
          equity: "100000.00"
          long_market_value: "40000.00"
          maintenance_margin_excess: "50000.00"
          maintenance_margin_requirement: "50000.00"
          short_market_value: "10000.00"
          trade_cash: "70000.00"
        trade_cash: "70000.00"
        unrealized_pnl: "1500.00"
        unsettled_credits: "20000.00"
        unsettled_debits: "10000.00"
        withdrawable_cash: "75000.00"
    AccountBalancesSod:
      type: object
      required:
        - buying_power
        - equity
        - long_market_value
        - short_market_value
      properties:
        asof:
          type:
            - string
            - "null"
          format: date
          description: |-
            Timestamp for the start-of-day values.
            When a null/undefined value is observed, it indicates that there is no available data.
          example: 2023-09-27
        buying_power:
          type: string
          description: Start-of-day buying power.
          example: "90000.00"
        day_trade_buying_power:
          type:
            - string
            - "null"
          description: |-
            Start-of-day day-trade buying power.
            When a null/undefined value is observed, it indicates it does not apply.
          deprecated: true
          example: "200000.00"
        equity:
          type: string
          description: Start-of-day equity.
          example: "100000.00"
        long_market_value:
          type: string
          description: Start-of-day long market value.
          example: "40000.00"
        maintenance_margin_excess:
          type:
            - string
            - "null"

    ResponseMetadata:
      type: object
      description: |-
        Metadata for the response. This will always contain a request ID which can be used to identify
        the request to Clear Street for tracing, and optionally may include pagination data.
      required:
        - request_id
      properties:
        next_page_token:
          oneOf:
            - type: "null"
            - type: string
              format: byte
              description: Base64URL-encoded pagination token
          description: |-
            A token that can be used to retrieve the next page of results, if any.
            The token contains opaque pagination state.
            Filtering and sorting parameters must be provided with each request.
        page_number:
          type:
            - integer
            - "null"
          format: int32
          description: Pagination. Included if this was a GET (list) response
          example: "1"
          minimum: 0
        previous_page_token:
          oneOf:
            - type: "null"
            - type: string
              format: byte
              description: Base64URL-encoded pagination token
          description: |-
            A token that can be used to retrieve the previous page of results, if any.
            The token contains opaque pagination state.
            Filtering and sorting parameters must be provided with each request.
        request_id:
          type: string
          description: A unique ID for this request, generated upon ingestion of the request.
        total_items:
          type:
            - integer
            - "null"
          format: int64
          description: Total number of items available (not just in this page).
          example: "42"
          minimum: 0
        total_pages:
          type:
            - integer
            - "null"
          format: int32
          description: Total number of pages available.
          example: "5"
          minimum: 0
    ResponseStatus:
      type: string
      description: Dynamic lifecycle status for a pollable response.
      enum:

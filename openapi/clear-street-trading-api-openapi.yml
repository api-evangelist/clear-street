    SnapshotLastTrade:
      type: object
      description: |-
        Last-trade fields for a market data snapshot.

        For index instruments this carries the current index *level* — a computed
        value, not a trade: `price` is the level and `size` is always `0` (no
        contract changes hands).
      required:
        - price
        - size
      properties:
        price:
          type: string
          description: |-
            Most recent last-sale eligible trade price. For index instruments, the
            current index level.
        size:
          type: integer
          format: int32
          description: |-
            Share quantity of the most recent last-sale eligible trade. Always `0`
            for index instruments, whose level is computed rather than traded.
          minimum: 0
    SnapshotQuote:
      type: object
      description: L1 quote fields for a market data snapshot.
      properties:
        ask:
          type:
            - string
            - "null"
          description: |-
            Current best ask. Absent when no ask is available (one-sided quote).
            When a null/undefined value is observed, it indicates that there is no available data.
        ask_size:
          type:
            - integer
            - "null"
          format: int32
          description: |-
            Size at the best ask, in shares.
            When a null/undefined value is observed, it indicates that there is no available data.
          minimum: 0
        bid:
          type:
            - string
            - "null"
          description: |-
            Current best bid. Absent when no bid is available (one-sided quote).
            When a null/undefined value is observed, it indicates that there is no available data.
        bid_size:
          type:
            - integer
            - "null"
          format: int32
          description: |-
            Size at the best bid, in shares.
            When a null/undefined value is observed, it indicates that there is no available data.
          minimum: 0
        midpoint:
          type:
            - string
            - "null"
          description: |-
            Midpoint of bid and ask. Absent when either side is missing.
            When a null/undefined value is observed, it indicates that there is no available data.

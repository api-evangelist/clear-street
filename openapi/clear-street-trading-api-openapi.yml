              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Omni AI
      summary: Create Message
      description: |-
        Continue an existing conversation thread.

        Appends a new user message to the thread and starts an assistant response.
        Only one response may be active per thread at a time — if the previous turn
        is still in progress, this endpoint returns **409 Conflict**. Wait for the
        active response to reach a terminal status before submitting the next turn.

        Poll the returned `response_id` via `GET /omni-ai/responses/{response_id}`
        for assistant output.
      operationId: create_message
      parameters:
        - name: thread_id
          in: path
          description: Thread to continue
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
        required: true
      responses:
        "200":
          description: Message accepted. Poll the returned `response_id` for assistant output.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateMessageResponse"
                type: object
              examples:
                MessageAccepted:
                  summary: Thread message accepted successfully
                  value:
                    data:
                      response_id: 019dbaec-8dd3-7fa3-89d0-5303609f125f
                      thread_id: 019dbae9-73b3-7fe0-bd14-25fe57e91475
                      user_message_id: 019dbaec-8dd4-7f91-bce2-3ec8fba79eb7
                    metadata:
                      request_id: 48775400-61f4-4c6c-bc6d-8f4996c571c7
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                MalformedJsonSyntax:
                  summary: Malformed JSON payload
                  value:
                    error:
                      code: 400
                      message: "Failed to parse the request body as JSON: EOF while parsing an object at line 3 column 0"
                    metadata:
                      request_id: 8cf61bb3-a8c6-4f3e-abe8-5a5327001b55
        "409":
          description: Thread already has an active response — wait for it to complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ActiveResponseConflict:

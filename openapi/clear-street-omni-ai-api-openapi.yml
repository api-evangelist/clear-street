          description: Modification targets and deltas needed to construct replace-order API requests.
      example:
        action_type: MODIFY
        orders:
        - account_id: 100019
          limit_price: '178.00'
          order_id: 019dfd73-8b49-7d21-8d62-a736fc4199d2
    Side:
      type: string
      description: Side of an order
      enum:
      - BUY
      - SELL
      - SELL_SHORT
      - OTHER
    DataChart:
      type: object
      description: Chart represented by explicit data series.
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChartSeries'
    CreateThreadResponse:
      type: object
      description: Response payload for thread creation.
      required:
      - response_id
      - thread_id
      - user_message_id
      properties:
        response_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        user_message_id:
          type: string
          format: uuid
    Capability:
      type: string
      description: 'Capability allowlist for structured actions.


        Clients declare which capabilities they support when starting a run.

        Omni AI will only emit structured actions that match the declared capabilities.'
      enum:
      - PREFILL_ORDER
      - OPEN_CHART
      - OPEN_SCREENER
      - OPEN_ENTITLEMENT_CONSENT
    ScreenerFilter:
      type: object
      description: A single filter criterion for the screener.
      required:
      - field
      - operator
      - value
      properties:
        field:

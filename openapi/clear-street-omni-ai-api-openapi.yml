      required:
      - side
      - quantity
      - order_type
      - time_in_force
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp when the order should expire (UTC). Required when time_in_force is GOOD_TILL_DATE.
          example: 2025-10-15 16:00:00+00:00
        extended_hours:
          type:
          - boolean
          - 'null'
          description: Allow trading outside regular trading hours. Some brokers disallow options outside RTH.
        id:
          type:
          - string
          - 'null'
          description: Optional client-provided unique ID (idempotency). Required to be unique per account.
          example: my-ref-id-20251001-002
          maxLength: 64
        instrument_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InstrumentIdOrSymbol'
            description: Instrument ID (UUID) or symbol (equity ticker or OSI option symbol). Either `symbol` or `instrument_id` must be provided.
        limit_offset:
          type:
          - string
          - 'null'
          description: Limit offset for trailing stop-limit orders (signed)
          example: '0.50'
        limit_price:
          type:
          - string
          - 'null'
          description: Limit price (required for LIMIT and STOP_LIMIT orders)
          example: '48.00'
        order_type:
          $ref: '#/components/schemas/RequestOrderType'
          description: Type of order
        quantity:
          type: string
          description: 'Quantity to trade. For COMMON_STOCK: shares (may be fractional if supported).

            For OPTION (single-leg): contracts (must be an integer)'
          example: '1'
        side:
          $ref: '#/components/schemas/Side'
          description: Side of the order
        stop_price:
          type:
          - string
          - 'null'
          description: Stop price (required for STOP and STOP_LIMIT orders)
          example: '52.00'
        symbol:
          type:
          - string
          - 'null'
          description: 'Trading symbol. For equities, use the ticker symbol (e.g., "TSLA").

            For options, use the OSI symbol (e.g., "TSLA  250117C00190000").

            Either `symbol` or `instrument_id` must be provided.'
          example: TSLA
        time_in_force:
          $ref: '#/components/schemas/RequestTimeInForce'
          description: Time in force
        trailing_offset:
          type:
          - string
          - 'null'
          description: Trailing offset amount (required for trailing orders)
          example: '2.00'
        trailing_offset_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrailingOffsetType'
            description: Trailing offset type (PRICE or PERCENT_BPS)
      example:
        order_type: MARKET
        quantity: '1'
        side: BUY
        symbol: TSLA
        time_in_force: DAY
    Thread:
      type: object
      description: Thread metadata returned by list/get thread endpoints.
      required:
      - id
      - title
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
        id:
          type: string
          format: uuid
        title:
          type: string
        updated_at:
          type: string
    OpenScreenerAction:
      type: object
      description: Action to open a stock screener with filters.
      required:
      - filters
      properties:
        columns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Optional field/column selection for screener results.

            When a null/undefined value is observed, it indicates it does not apply.'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ScreenerFilter'
          description: Filter criteria for the screener
        page_size:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Optional page size.

            When a null/undefined value is observed, it indicates it does not apply.'
        sort_by:
          type:
          - string
          - 'null'
          description: 'Optional sort field for screener rows.

            When a null/undefined value is observed, it indicates it does not apply.'
        sort_direction:
          type:
          - string
          - 'null'
          description: 'Optional sort direction (`ASC` or `DESC`).

            When a null/undefined value is observed, it indicates it does not apply.'
      example:
        filters:
        - field: sector
          operator: eq
          value: Technology
        - field: market_cap
          operator: gte
          value: 10000000000
    RequestTimeInForce:
      type: string
      description: Strict time-in-force enum for order submission requests.
      enum:
      - DAY
      - GOOD_TILL_CANCEL
      - IMMEDIATE_OR_CANCEL
      - FILL_OR_KILL
      - GOOD_TILL_DATE
      - AT_THE_OPENING
      - AT_THE_CLOSE
      - GOOD_TILL_CROSSING
      - GOOD_THROUGH_CROSSING
      - AT_CROSSING
    EntitlementResourceList:
      type: array
      items:
        $ref: '#/components/schemas/EntitlementResource'
    ActionButton:
      type: object
      description: Button metadata shared by chart and suggested-actions payloads.
      required:
      - buttonId
      - label
      properties:
        buttonId:
          type: string
          description: Stable button identifier within the content part.
        label:
          type: string
          description: User-visible label.
        prompt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PromptButtonAction'
            description: 'Follow-up prompt to submit as the next user message.

              When a null/undefined value is observed, it indicates it does not apply.'
        structuredAction:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StructuredActionButtonAction'
            description: 'Structured action in the same message to execute on click.

              When a null/undefined value is observed, it indicates it does not apply.'
    ContentPartCustomPayload:
      type: object
      description: Escape-hatch custom payload content part.
      required:
      - payload
      properties:
        payload:
          type: object
    CreateFeedbackResponse:
      type: object
      required:
      - created_at
      properties:
        created_at:
          type: string
        feedback_id:
          type:
          - string
          - 'null'
          format: uuid
          description: When a null/undefined value is observed, it indicates that there is no available data.
    ChartSeries:
      type: object
      description: Named data series within a chart.
      required:
      - name
      properties:
        name:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
    ConversationMode:
      type: string
      description: Thread creation mode.
      enum:
      - instant
      - deep_insights
    ApiError:
      type: object
      description: A direct mapping of tonic::Status, for use in HTTP responses.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: 'The error code is used to identify the nature of the error. It corresponds

            to an HTTP status code.'
          example: 400
          minimum: 0
        details:
          $ref: '#/components/schemas/ErrorDetails'
          description: 'Additional error details, if any. This can include structured information

            such as field violations or error metadata.'
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Order quantity must be greater than zero
    ContentPartTextPayload:
      type: object
      description: Text content part.
      required:
      - text
      properties:
        text:
          type: string
    CreateMessageRequest:
      type: object
      description: Continue-thread message creation request body.
      required:
      - account_id
      - text
      properties:
        account_id:
          type: integer
          format: int64
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        text:
          type: string
      example:
        account_id: 19816
        text: Compare that to AMD.
    CancelResponsePayload:
      type: object
      required:
      - canceled
      properties:
        canceled:
          type: boolean
    PrefillOrderAction:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/PrefillNewOrderAction'
          description: Create one or more new orders.
        - type: object
          required:
          - action_type
          properties:
            action_type:
              type: string
              enum:
              - NEW
        title: PrefillNewOrderAction
        description: Create one or more new orders.
      - allOf:
        - $ref: '#/components/schemas/PrefillCancelOrderAction'
          description: Cancel one or more existing orders.
        - type: object
          required:
          - action_type
          properties:
            action_type:
              type: string
              enum:
              - CANCEL
        title: PrefillCancelOrderAction
        description: Cancel one or more existing orders.
      - allOf:
        - $ref: '#/components/schemas/PrefillModifyOrderAction'
          description: Modify one or more existing orders.
        - type: object
          required:
          - action_type
          properties:
            action_type:
              type: string
              enum:
              - MODIFY
        title: PrefillModifyOrderAction
        description: Modify one or more existing orders.
      description: 'Action to prefill order details for user confirmation.


        The user must review and authorize the order before submission to the trading API.

        This action provides parsed order data that can be used to prefill an order ticket UI

        or submitted directly via the orders API after user confirmation.'
    EntitlementAgreementResourceList:
      type: array
      items:
        $ref: '#/components/schemas/EntitlementAgreementResource'
    PrefillModifyOrderRequest:
      allOf:
      - oneOf:
        - type: object
          description: 'Request to replace (modify) an existing order


            At least one field must be provided.'
          properties:
            limit_price:
              type:
              - string
              - 'null'
              description: New limit price for the order
              example: '49.00'
            quantity:
              type:
              - string
              - 'null'
              description: New quantity for the order
              example: '1'
            stop_price:
              type:
              - string
              - 'null'
              description: New stop price for the order
              example: '52.00'
          example:
            limit_price: '49.00'
        description: Fields to replace, flattened to match the replace-order request body.
      - type: object
        required:
        - order_id
        - account_id
        properties:
          account_id:
            $ref: '#/components/schemas/i64'
            description: Account ID that owns the order.
          order_id:
            type: string
            description: Order ID to modify.
      description: 'One order modification emitted as part of an Omni prefill action.


        The replace-order REST endpoint carries `account_id` and `order_id` in its

        path and accepts `ReplaceOrderRequest` as its body. A structured action has

        no request path, so this type combines the target identifiers with the body

        fields the frontend needs to construct that request. `request` is flattened

        so the deltas are not nested under a second `request` object in the emitted

        structured-action JSON.'
    CancelOrderRequest:
      type: object
      description: 'Request to cancel an existing order


        Note: In the API, order cancellation is done via DELETE request without a body.

        The order_id and account_id come from the URL path parameters.'
      required:
      - order_id
      - account_id
      properties:
        account_id:
          $ref: '#/components/schemas/i64'
          description: Account ID (from path parameter)
        order_id:
          type: string
          description: Order ID to cancel (from path parameter)
    CreateMessageResponse:
      type: object
      description: Response payload for continuing a thread with a new message.
      required:
      - response_id
      - thread_id
      - user_message_id
      properties:
        response_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        user_message_id:
          type: string
          format: uuid
    Message:
      type: object
      description: Final immutable message.
      required:
      - id
      - thread_id
      - created_at
      - seq
      - role
      - outcome
      - content
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'
        created_at:
          type: string
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ErrorStatus'
            description: When a null/undefined value is observed, it indicates it does not apply.
        id:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/MessageOutcome'
        role:
          $ref: '#/components/schemas/MessageRole'
        seq:
          type: integer
          format: int64
        thread_id:
          type: string
          format: uuid
    i64:
      type: integer
      format: int64
    DeepInsightsTarget:
      type: object
      description: Deep-insights target payload.
      required:
      - type
      - ticker
      properties:
        ticker:
          type: string
        type:
          $ref: '#/components/schemas/DeepInsightsTargetType'
    MessageRole:
      type: string
      description: Finalized message role in the public contract.
      enum:
      - USER
      - ASSISTANT
    SuggestedActionsPayload:
      type: object
      description: Suggested follow-up buttons rendered at the end of an assistant message.
      properties:
        actionButtons:
          type: array
          items:
            $ref: '#/components/schemas/ActionButton'
          description: Ordered message-level buttons.
      example:
        actionButtons:
        - buttonId: btn_show_aapl_1y
          label: Show AAPL over 1 year
          prompt:
            prompt: Show AAPL over the last year
        - buttonId: btn_compare_aapl_spy
          label: Compare AAPL vs SPY
          prompt:
            prompt: Compare AAPL vs SPY over 1 year
    InstrumentIdOrSymbol:
      type: string
      description: 'Instrument identifier: either an instrument UUID or a symbol (symbol for equities, OSI for options). Non-UUID inputs are resolved server-side.'
      minLength: 1
    BaseResponse:
      type: object
      required:
      - metadata
      properties:
        error:
          oneOf:
          - oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApiError'
              description: Structured error details when the request is unsuccessful.
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
          description: Response metadata, including the request ID and optional pagination info.
    PrefillCancelOrderAction:
      type: object
      description: Cancel-order prefill action.
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CancelOrderRequest'
          description: Orders to cancel using the same identifiers required by the cancel-order API.
      example:
        action_type: CANCEL
        orders:
        - account_id: 100019
          order_id: 019dfd73-8b49-7d21-8d62-a736fc4199d2
    ResponseStatus:
      type: string
      description: Dynamic lifecycle status for a pollable response.
      enum:
      - queued
      - running
      - succeeded
      - failed
      - canceled
    ThreadList:
      type: array
      items:
        $ref: '#/components/schemas/Thread'
    ContentPartStructuredActionPayload:
      type: object
      description: Structured action content part.
      required:
      - action_id
      - action
      properties:
        action:
          $ref: '#/components/schemas/StructuredAction'
        action_id:
          type: string
          format: uuid
    MessageList:
      type: array
      items:
        $ref: '#/components/schemas/Message'
    MessageContent:
      type: object
      description: Finalized immutable message content container. Never includes thinking parts.
      required:
      - parts
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessageContentPart'
    OpenEntitlementConsentAction:
      type: object
      description: Action to open entitlement consent flow for one or more accounts.
      required:
      - agreement_key
      - account_ids
      - entitlement_codes
      - reason
      properties:
        account_ids:
          type: array
          items:
            type: integer
            format: int64
        agreement_key:
          $ref: '#/components/schemas/EntitlementAgreementKey'
        entitlement_codes:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementCode'
        reason:
          type: string
      example:
        account_ids:
        - 100019
        agreement_key: omni_account_data_access
        entitlement_codes:
        - omni.account_data
        reason: Portfolio analysis requires Omni consent to access account data.
    EntitlementResource:
      type: object
      required:
      - entitlement_id
      - account_id
      - entitlement_code
      - agreement_id
      - granted_at
      properties:
        account_id:
          type: integer
          format: int64
        agreement_id:
          type: string
        entitlement_code:
          $ref: '#/components/schemas/EntitlementCode'
        entitlement_id:
          type: string
        granted_at:
          type: string
    RequestOrderType:
      type: string
      description: Strict order-type enum for order submission/replacement requests.
      enum:
      - MARKET
      - LIMIT
      - STOP
      - STOP_LIMIT
      - TRAILING_STOP
      - TRAILING_STOP_LIMIT
    CreateFeedbackRequest:
      type: object
      required:
      - account_id
      - score
      properties:
        account_id:
          type: integer
          format: int64
          description: Account ID for the request
        comment:
          type: string
          description: Optional feedback comment
        metadata:
          type:
          - object
          - 'null'
          description: Optional metadata
        score:
          type: integer
          format: int32
          description: Feedback score (-1, 0, +1 or 1-5)
    DeleteEntitlementResponse:
      type: object
      required:
      - entitlement_id
      - revoked
      properties:
        entitlement_id:
          type: string
        revoked:
          type: boolean
    ContentPartThinkingPayload:
      type: object
      description: Thinking content part shown on dynamic response polling.
      required:
      - thoughts
      properties:
        thoughts:
          type: array
          items:
            type: string
    EntitlementCode:
      type: string
      description: Stable entitlement code granted by an agreement.
      enum:
      - omni.account_data
    MessageContentPart:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/ContentPartTextPayload'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - text
        title: ContentPartText
      - allOf:
        - $ref: '#/components/schemas/ContentPartStructuredActionPayload'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - structured_action
        title: ContentPartStructuredAction
      - allOf:
        - $ref: '#/components/schemas/ContentPartChartPayload'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - chart
        title: ContentPartChart
      - allOf:
        - $ref: '#/components/schemas/ContentPartSuggestedActionsPayload'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - suggested_actions
        title: ContentPartSuggestedActions
      - allOf:
        - $ref: '#/components/schemas/ContentPartCustomPayload'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - custom
        title: ContentPartCustom
      description: Final immutable content part visible on persisted messages.
    ErrorDetails:
      type: array
      items:
        type: object
        additionalProperties: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

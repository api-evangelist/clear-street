  /v1/omni-ai/threads/{thread_id}/messages:
    get:
      tags:
      - Omni AI
      summary: Get Messages
      description: 'List finalized messages in a thread.


        Returns the latest page of **finalized** messages by default, with messages

        within each page ordered chronologically. Messages from in-progress

        assistant turns are excluded — use

        `GET /omni-ai/threads/{thread_id}/response` or

        `GET /omni-ai/responses/{response_id}` for live output.


        If the last finalized message has role `USER`, an active response likely

        exists and should be polled separately.'
      operationId: get_messages
      parameters:
      - name: thread_id
        in: path
        description: Thread to list messages for
        required: true
        schema:
          type: string
          format: uuid
      - name: account_id
        in: query
        description: Account ID for the request
        required: true
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        description: The number of items to return per page. Only used when page_token is not provided.
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 100
          minimum: 1
      - name: page_token
        in: query
        description: Token for retrieving the next or previous page of results. Contains encoded pagination state; when provided, page_size is ignored.
        required: false
        schema:
          type: string
          format: byte
          description: Base64URL-encoded pagination token
        example: eyJvZmZzZXQiOjEwMCwibGltaXQiOjEwMH0=
      responses:
        '200':
          description: Paginated list of finalized messages; latest page by default, chronological within each page
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MessageList'
                type: object
              examples:
                ThreadMessages:
                  summary: User and assistant finalized messages
                  value:
                    data:
                    - content:
                        parts:
                        - text: How are the markets doing today?
                          type: text
                      created_at: 2026-04-16 09:20:17.274943+00:00
                      id: 019d9597-5983-7691-8281-7ce264127740
                      outcome: completed
                      role: USER
                      seq: 1
                      thread_id: 019d9597-597c-7571-a0c9-a49c0e51f6eb
                    - content:
                        parts:
                        - text: "**Pre-market as of 7:30 AM ET**\n\n ..."
                          type: text
                        - payload:
                            actionButtons:
                            - buttonId: btn_followup_0
                              label: Check my positions
                              prompt:
                                prompt: What are my current positions?
                          type: suggested_actions
                      created_at: 2026-04-16 09:20:17.309212+00:00
                      id: 019d9597-599c-7132-a7de-e5c21eaaab77
                      outcome: completed
                      role: ASSISTANT
                      seq: 2
                      thread_id: 019d9597-597c-7571-a0c9-a49c0e51f6eb
                    metadata:
                      request_id: 664c0f85-cdab-4fac-afe3-8ecc0148cd4a
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Forbidden:
                  summary: Caller does not have permission
                  value:
                    error:
                      code: 403
                      message: The caller does not have permission to execute the specified operation
                    metadata:
                      request_id: e3e4df36-1c33-45b1-b06d-832c80adbbf6
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ThreadNotFound:
                  summary: Requested thread does not exist
                  value:
                    error:
                      code: 404
                      message: Thread not found
                    metadata:
                      request_id: a1c173e9-4fc0-44d0-b89f-4ac67ca45032
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Omni AI
      summary: Create Message
      description: 'Continue an existing conversation thread.


        Appends a new user message to the thread and starts an assistant response.

        Only one response may be active per thread at a time — if the previous turn

        is still in progress, this endpoint returns **409 Conflict**. Wait for the

        active response to reach a terminal status before submitting the next turn.


        Poll the returned `response_id` via `GET /omni-ai/responses/{response_id}`

        for assistant output.'
      operationId: create_message
      parameters:
      - name: thread_id
        in: path
        description: Thread to continue
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
        required: true
      responses:
        '200':
          description: Message accepted. Poll the returned `response_id` for assistant output.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CreateMessageResponse'
                type: object
              examples:
                MessageAccepted:
                  summary: Thread message accepted successfully
                  value:
                    data:
                      response_id: 019dbaec-8dd3-7fa3-89d0-5303609f125f
                      thread_id: 019dbae9-73b3-7fe0-bd14-25fe57e91475
                      user_message_id: 019dbaec-8dd4-7f91-bce2-3ec8fba79eb7
                    metadata:
                      request_id: 48775400-61f4-4c6c-bc6d-8f4996c571c7
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MalformedJsonSyntax:
                  summary: Malformed JSON payload
                  value:
                    error:
                      code: 400
                      message: 'Failed to parse the request body as JSON: EOF while parsing an object at line 3 column 0'
                    metadata:
                      request_id: 8cf61bb3-a8c6-4f3e-abe8-5a5327001b55
        '409':
          description: Thread already has an active response — wait for it to complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ActiveResponseConflict:
                  summary: Thread already has an active response
                  value:
                    error:
                      code: 409
                      message: thread already has an active response
                    metadata:
                      request_id: 7b34ad9b-e09a-40d1-aab8-2185a8df5a31
        '422':
          description: Malformed request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                PayloadMissingAccountId:
                  summary: Missing required account_id field in JSON body
                  value:
                    error:
                      code: 422
                      message: 'Failed to deserialize the JSON body into the target type: missing field `account_id` at line 3 column 3'
                    metadata:
                      request_id: 9fbd975d-be1e-4710-9004-1f54d0d4dfb6
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/omni-ai/threads/{thread_id}/response:
    get:
      tags:
      - Omni AI
      summary: Get Thread Response
      description: 'Get the active response for a thread.


        Convenience endpoint to look up the currently active response for a thread

        without knowing the `response_id`. Useful when reloading a thread whose

        last finalized message is a `USER` message — this indicates an assistant

        turn is likely in progress.


        Returns **404** if no active response exists (the thread is idle).'
      operationId: get_thread_response
      parameters:
      - name: thread_id
        in: path
        description: Thread to check for active response
        required: true
        schema:
          type: string
          format: uuid
      - name: account_id
        in: query
        description: Account ID for the request
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Current response snapshot or idle thread
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Response'
                      - type: 'null'
                type: object
              examples:
                ActiveThreadResponse:
                  summary: Currently running response for a thread
                  value:
                    data:
                      content:
                        parts:
                        - text: ''
                          type: text
                        - thoughts:
                          - '[1/4] Running parallel analysis on AAPL -- fundamentals, technicals, sentiment, and macro...'
                          type: thinking
                      id: 019dbb03-cf23-74e1-9c31-ef0136ff7fed
                      output_message_id: 019dbb03-cf32-74d1-906b-a148d4be3da9
                      status: running
                      thread_id: 019dbb03-cf22-7da0-a663-f51c756efa07
                      user_message_id: 019dbb03-cf24-7b03-8286-5bfc2411b052
                    metadata:
                      request_id: 927a85a6-b11b-4cc5-a2cd-3f46ae64e85d
                IdleThread:
                  summary: Thread is idle
                  value:
                    data: null
                    metadata:
                      request_id: e0f1c3a2-5b6d-4f8e-9c1a-2d3e4f5b6c7d
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Forbidden:
                  summary: Caller does not have permission
                  value:
                    error:
                      code: 403
                      message: The caller does not have permission to execute the specified operation
                    metadata:
                      request_id: ef354353-f9ca-4d0c-a8ef-4566a5072434
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ThreadNotFound:
                  summary: Thread doesn't exist
                  value:
                    error:
                      code: 404
                      message: Thread not found
                    metadata:
                      request_id: dadd546f-eb7e-4b78-8d36-7d0a70b8a70d
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    EntitlementAgreementKey:
      type: string
      description: Stable entitlement agreement family key.
      enum:
      - omni_account_data_access
    StructuredAction:
      oneOf:
      - type: object
        title: PrefillOrder
        description: Prefill an order ticket for user confirmation
        required:
        - prefill_order
        properties:
          prefill_order:
            $ref: '#/components/schemas/PrefillOrderAction'
            description: Prefill an order ticket for user confirmation
      - type: object
        title: OpenChart
        description: Open a chart for a symbol
        required:
        - open_chart
        properties:
          open_chart:
            $ref: '#/components/schemas/OpenChartAction'
            description: Open a chart for a symbol
      - type: object
        title: OpenScreener
        description: Open a stock screener with filters
        required:
        - open_screener
        properties:
          open_screener:
            $ref: '#/components/schemas/OpenScreenerAction'
            description: Open a stock screener with filters
      - type: object
        title: OpenEntitlementConsent
        description: Open entitlement consent flow
        required:
        - open_entitlement_consent
        properties:
          open_entitlement_consent:
            $ref: '#/components/schemas/OpenEntitlementConsentAction'
            description: Open entitlement consent flow
      description: 'Structured actions that Omni AI can return to clients.


        These actions provide machine-readable instructions for the client to execute,

        such as prefilling an order ticket, opening a chart, or navigating to a route.'
    ContentPartSuggestedActionsPayload:
      type: object
      description: Suggested actions payload content part.
      required:
      - payload
      properties:
        payload:
          $ref: '#/components/schemas/SuggestedActionsPayload'
    TrailingOffsetType:
      type: string
      description: Trailing offset type for trailing stop orders.
      enum:
      - PRICE
      - BPS
    ResponseMetadata:
      type: object
      description: 'Metadata for the response. This will always contain a request ID which can be used to identify

        the request to Clear Street for tracing, and optionally may include pagination data.'
      required:
      - request_id
      properties:
        next_page_token:
          oneOf:
          - type: 'null'
          - type: string
            format: byte
            description: Base64URL-encoded pagination token
          description: 'A token that can be used to retrieve the next page of results, if any.

            The token contains opaque pagination state.

            Filtering and sorting parameters must be provided with each request.'
        page_number:
          type:
          - integer
          - 'null'
          format: int32
          description: Pagination. Included if this was a GET (list) response
          example: '1'
          minimum: 0
        previous_page_token:
          oneOf:
          - type: 'null'
          - type: string
            format: byte
            description: Base64URL-encoded pagination token
          description: 'A token that can be used to retrieve the previous page of results, if any.

            The token contains opaque pagination state.

            Filtering and sorting parameters must be provided with each request.'
        request_id:
          type: string
          description: A unique ID for this request, generated upon ingestion of the request.
        total_items:
          type:
          - integer
          - 'null'
          format: int64
          description: Total number of items available (not just in this page).
          example: '42'
          minimum: 0
        total_pages:
          type:
          - integer
          - 'null'
          format: int32
          description: Total number of pages available.
          example: '5'
          minimum: 0
    ChartPoint:
      type: object
      description: Single chart coordinate.
      required:
      - x
      - y
      properties:
        x:
          type: string
        y:
          type: number
          format: double
    CreateThreadRequest:
      type: object
      description: Create-thread request body.
      required:
      - account_id
      - type
      properties:
        account_id:
          type: integer
          format: int64
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        target:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DeepInsightsTarget'
        text:
          type:
          - string
          - 'null'
        thesis:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/ConversationMode'
      example:
        account_id: 19816
        text: What changed in NVDA today?
        type: instant
    CreateEntitlementsRequest:
      type: object
      required:
      - agreement_id
      - entitlement_codes
      - account_ids
      properties:
        account_ids:
          type: array
          items:
            type: integer
            format: int64
        agreement_id:
          type: string
        entitlement_codes:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementCode'
      example:
        account_ids:
        - 100019
        - 100021
        agreement_id: 01JZ0000000000000000000000
        entitlement_codes:
        - omni.account_data
    ErrorStatus:
      type: object
      description: Shared sanitized error payload.
      required:
      - code
      - message
      properties:
        code:
          type: string
        details:
          type:
          - object
          - 'null'
          description: When a null/undefined value is observed, it indicates it does not apply.
        message:
          type: string
    PromptButtonAction:
      type: object
      description: Prompt-style button behavior.
      required:
      - prompt
      properties:
        prompt:
          type: string
          description: Prompt text to submit as the next user turn.
    PrefillModifyOrderAction:
      type: object
      description: Modify-order prefill action.
      required:
      - orders
      properties:
        orders:
          type: array

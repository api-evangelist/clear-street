    machine-readable rejection code in the error body.
- status: 500
  title: Internal server error
  api: trading
  occurrences: 55
  remediation: Retry with backoff; quote metadata.request_id to support if persistent.
- status: 503
  title: Service temporarily unavailable
  api: trading
  occurrences: 4

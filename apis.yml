apis:
- aid: clear-street:trading-api
  name: Clear Street Trading API
  description: 'A unified RESTful API for client interactions with the Clear Street Active
    trading platform: accounts and balances, order submission/replacement/cancellation,
    executions, positions and position instructions, instrument reference and fundamentals,
    market data snapshots and daily summaries, news, calendars, screeners, watchlists, and
    the Omni AI financial copilot (threads, messages, responses, entitlements). Bearer JWT
    auth; cursor pagination; a data/error/metadata response envelope carrying request_id.'
  humanURL: https://docs.clearstreet.com/
  baseURL: https://api.clearstreet.com
  tags:
  - Trading
  - Orders
  - Positions
  - Market Data
  - Instruments
  - Accounts

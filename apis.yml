- aid: clear-street:mcp
  name: Clear Street MCP Server
  description: 'Clear Street''s official remote Model Context Protocol server, exposing the
    Clear Street Trading API to AI assistants such as Claude and Gemini. OAuth-protected
    per RFC 9728 — an anonymous request returns a WWW-Authenticate challenge pointing at
    /.well-known/oauth-protected-resource/v1/mcp, whose authorization server is
    https://api.clearstreet.com/oauth/mcp (authorization_code + PKCE S256).'
  humanURL: https://www.clearstreet.com/api
  baseURL: https://api.clearstreet.com/v1/mcp
  tags:
  - MCP
  - AI Agents
  - Trading
  properties:
  - type: MCPServer
    url: mcp/clear-street-mcp.yml
  - type: ToolCrosswalk
    url: mcp/clear-street-tool-crosswalk.yml
- aid: clear-street:legacy-api
  name: Clear Street API (Trades and Uploads)
  description: 'Clear Street''s legacy post-trade API for booking and cancelling trades and
    for submitting bulk trade-file uploads. Published as a Swagger 2.0 document in the
    clear-street/docs GitHub repository alongside the FIX 4.2 trade specification, the OMS
    guide, and SFTP file-transfer documentation.'
  humanURL: https://clear-street.github.io/docs/
  baseURL: https://api.clearstreet.io/v1
  tags:
  - Post Trade

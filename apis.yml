aid: clear-street
name: Clear Street
description: 'Clear Street is a New York–based financial technology firm building independent,
  cloud-native prime brokerage, clearing, and execution infrastructure for institutional
  and active individual traders. It is a FINRA/SIPC member broker-dealer, a CFTC-registered
  Futures Commission Merchant, and FCA-authorised in the UK. Clear Street ships three public
  API surfaces: the Clear Street Trading API (OpenAPI 3.1, api.clearstreet.com) covering
  accounts, orders, executions, positions, instruments, market data, screeners, watchlists
  and the Omni AI financial copilot; the Clear Street Studio API (OpenAPI 3.0, prime-brokerage
  holdings, locates, easy-borrows, P&L, and Reg-T/portfolio margin) with a companion WebSocket
  activity stream; and an OAuth-protected remote MCP server for AI agents. First-party SDKs
  ship for Python, TypeScript, Go and Kotlin/Java, alongside a Go CLI (clst) and a published
  set of open Agent Skills.'
image: https://clear-street.github.io/docs/assets/logo.png

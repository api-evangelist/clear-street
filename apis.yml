- aid: clear-street:studio-api
  name: Clear Street Studio API
  description: 'The Clear Street Studio prime-brokerage API — an integrated Risk Management,
    Portfolio Management and Execution Management surface. Covers entities and accounts,
    holdings, orders and bulk orders, trades, positions, locate orders and easy-borrows,
    inventories, instruments, P&L summaries and details, and Reg-T / portfolio margin plus
    margin simulations. OAuth2 client-credentials bearer tokens; RFC 9457 problem details
    for errors; a companion WebSocket activity stream.'
  humanURL: https://docs.clearstreet.io/studio/docs/getting-started
  baseURL: https://api.clearstreet.io/studio/v2
  tags:
  - Prime Brokerage
  - Locates
  - Margin
  - Holdings
  - Orders
  - Securities Lending
  properties:

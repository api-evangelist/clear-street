apis:
- aid: clear-street:mcp
  name: Clear Street MCP Server
  description: >-
    Clear Street's official remote Model Context Protocol server, exposing the Clear Street Trading API
    to AI assistants such as Claude and Gemini. OAuth-protected per RFC 9728 — an anonymous request returns
    a WWW-Authenticate challenge pointing at /.well-known/oauth-protected-resource/v1/mcp, whose authorization
    server is https://api.clearstreet.com/oauth/mcp (authorization_code + PKCE S256).
  humanURL: https://www.clearstreet.com/api
  baseURL: https://api.clearstreet.com/v1/mcp
  tags:
  - MCP
  - AI Agents
  - Trading
  properties:
  - type: MCPServer
    url: mcp/clear-street-mcp.yml
  - type: ToolCrosswalk
    url: mcp/clear-street-tool-crosswalk.yml
